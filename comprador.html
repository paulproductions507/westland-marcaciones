<style>
:root{color-scheme:light;--h1:#0b4a52;--h2:#073a43;--pet:#0b4a52;--pet2:#073a43;--pet3:#0e6470;--acc:#0b4a52;
 --ink:#0f2a2e;--mt:#5b7479;--bg:#eef4f5;--card:#fff;--bd:#d3e2e4;--zb:#f5f9fa;--soft:#e1eeef;--hov:#e3f0f1;
 --cbd:#b7d1d4;--tbd:#0b4a52;--tsh:rgba(11,74,82,.20);--tsh2:rgba(11,74,82,.34);--track:#dfeced;
 --dbg:#fff3d6;--dtx:#8a5a00;--rbg:#dcf5e8;--rtx:#0e6b3c;--ubg:#dfeafc;--utx:#1c4a8a;--pbg:#efe3fa;--ptx:#5b2a86;--cbg:#fde6ee;--ctx:#8b1f4a;--wbg:#ffe5e2;--wtx:#a3261b;--err:#b3261e}
[data-theme=dark]{color-scheme:dark;--h1:#0a3d45;--h2:#052b32;--pet:#11707b;--pet2:#0a4f58;--pet3:#14879a;--acc:#5fe0d6;
 --ink:#e6f4f4;--mt:#8fb3b8;--bg:#061a1e;--card:#0c2a31;--bd:#1b4a54;--zb:#0f323a;--soft:#12404a;--hov:#143f49;
 --cbd:#1f5560;--tbd:#1f8f9c;--tsh:rgba(45,226,201,.14);--tsh2:rgba(45,226,201,.28);--track:#12404a;
 --dbg:#4a3a0e;--dtx:#ffd27a;--rbg:#0f4a33;--rtx:#7ff0b8;--ubg:#14305a;--utx:#9ec5ff;--pbg:#3a2358;--ptx:#d7b8ff;--cbg:#55203a;--ctx:#ffadc9;--wbg:#5a1f1a;--wtx:#ffb3ab;--err:#ff8a80}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;background:var(--bg);color:var(--ink);transition:background .2s,color .2s}
header{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;padding:20px 16px 46px}
.hin{max-width:1360px;margin:0 auto;position:relative}
header h1{margin:0;font-size:22px;letter-spacing:.2px}
header .sub{opacity:.9;font-size:12.5px;margin-top:4px;padding-right:90px}
.tg{position:absolute;right:0;top:0;background:#ffffff1f;color:#fff;border:1px solid #ffffff55;border-radius:99px;padding:5px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.tg:hover{background:#ffffff33}
.back{background:none;border:0;color:#fff;font:inherit;font-weight:700;cursor:pointer;padding:0 0 8px;opacity:.95}
.wrap{max-width:1360px;margin:-32px auto 0;padding:0 12px 24px}
.card{background:var(--card);border:1.5px solid var(--cbd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px var(--tsh)}
.card h2{margin:0 0 10px;font-size:14px;color:var(--acc);text-transform:uppercase;letter-spacing:.7px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--zb);border:1px solid var(--bd);border-top:4px solid var(--pet3);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:22px;color:var(--acc)}.kpi span{font-size:11px;color:var(--mt);text-transform:uppercase;letter-spacing:.5px}
.info{font-size:12.5px;color:var(--mt);margin-top:10px}.warn{color:var(--wtx)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input,.tools select,.btn{font-family:inherit}
.tools input,.tools select{font:inherit;border:1.5px solid var(--cbd);border-radius:9px;padding:8px 10px;background:var(--card);color:var(--ink);min-width:0}
.tools input[type=search]{flex:1 1 220px}.tools select{flex:1 1 140px}.tools input[type=number]{width:105px}
.btn{font:inherit;font-weight:700;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;background:var(--pet);color:#fff}
.btn.sec{background:var(--soft);color:var(--acc)}.btn:disabled{opacity:.6}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-weight:700;font-size:12px;white-space:nowrap}
.chip.D{background:var(--dbg);color:var(--dtx)}.chip.R{background:var(--rbg);color:var(--rtx)}
.chip.T{background:var(--soft);color:var(--acc)}.chip.pa{background:var(--wbg);color:var(--wtx);margin-left:6px}
.ty{background:var(--soft);color:var(--acc)}.ty.A{background:var(--dbg);color:var(--dtx)}.ty.U{background:var(--ubg);color:var(--utx)}.ty.P{background:var(--pbg);color:var(--ptx)}.ty.C{background:var(--cbg);color:var(--ctx)}
/* resumen */
.sum{display:flex;flex-wrap:wrap;background:var(--card);border:1.5px solid var(--cbd);border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:0 4px 14px var(--tsh)}
.sum div{flex:1 1 25%;padding:11px 6px;border-right:1px solid var(--bd);text-align:center}.sum div:last-child{border-right:0}
.sum b{display:block;font-size:21px;color:var(--acc)}.sum span{font-size:10.5px;color:var(--mt);text-transform:uppercase;letter-spacing:.5px}
/* tiles de packing list (mismo lenguaje que las tiendas de la app) */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.tile{border-radius:14px;overflow:hidden;border:2px solid var(--tbd);background:var(--card);cursor:pointer;box-shadow:0 6px 18px var(--tsh);transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 28px var(--tsh2)}
.tile .hd{background:linear-gradient(135deg,var(--pet3),var(--pet2));color:#fff;padding:11px 8px;text-align:center}
.tile .hd b{display:block;font-size:20px;font-weight:800;letter-spacing:.3px}
.tile .hd small{display:block;font-size:11px;opacity:.92;letter-spacing:.6px;text-transform:uppercase}
.tile.tr{border-color:#d99a1d}.tile.tr .hd{background:linear-gradient(135deg,#e6b035,#a8700a);color:#2b1b00}
.tile .bd{padding:12px 10px 10px;text-align:center;font-size:12.5px;color:var(--mt);line-height:1.6}
.tile .big{display:flex;justify-content:center;gap:26px;margin-bottom:8px}
.tile .big b{display:block;font-size:23px;color:var(--acc);line-height:1.2}.tile .big span{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
.tile .bd b.d{color:var(--ink)}
.tile .st{border-top:1px solid var(--bd);padding:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.tile .st .lb{width:100%;text-align:center;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mt)}
.sc{border:1.5px solid var(--tbd);color:var(--acc);border-radius:8px;padding:1px 10px;font-weight:800;font-size:12.5px;background:var(--soft)}
/* tablas */
.tw{overflow:auto;border:1.5px solid var(--cbd);border-radius:12px;max-height:64vh}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:980px}
th{position:sticky;top:0;background:var(--pet);color:#fff;text-align:left;padding:10px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;cursor:pointer;user-select:none}
th.n,td.n{text-align:right}
td{padding:8px 10px;border-top:1px solid var(--bd);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--zb)}tbody tr:hover td{background:var(--hov)}
tfoot td{background:var(--soft)!important;font-weight:800;position:sticky;bottom:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.sp{color:var(--mt);font-style:italic}
.sb{display:grid;grid-template-columns:150px 1fr 210px;gap:10px;align-items:center;padding:5px 0}
.sb .tr{background:var(--track);border-radius:99px;height:15px;overflow:hidden}.sb .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--pet3),var(--pet));border-radius:99px}
.sb .lb{font-weight:700;overflow:hidden;text-overflow:ellipsis}.sb .vl{font-size:12.5px;text-align:right;color:var(--mt)}.sb .vl b{color:var(--ink)}
.msg{padding:36px 14px;text-align:center;color:var(--mt)}.err{color:var(--err)}
.cnt{font-size:12.5px;color:var(--mt);margin:8px 2px}
footer{color:var(--mt);font-size:11.5px;text-align:center;padding:10px}
.hide{display:none!important}
.two{display:block}
@media(min-width:1000px){.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two .card{margin-bottom:12px}header h1{font-size:25px}.wrap{padding:0 24px 28px}header{padding:24px 24px 52px}}
@media(max-width:640px){.sb{grid-template-columns:100px 1fr}.sb .vl{grid-column:1/-1;text-align:left}}
/* ===== Menú sectorizado (mismo launcher de Consultas) ===== */
header .sub{padding-right:130px}
#hm,#hmHome{--ff:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--ac:#0e6470;padding:18px 14px 26px}
[data-theme=dark] #hm,[data-theme=dark] #hmHome{--ac:#2de2c9}
.hm-hero{padding:2px 4px 4px;animation:hmIn .6s cubic-bezier(.2,.9,.25,1) backwards}
.hm-hi{font:800 26px/1.1 var(--ff);letter-spacing:-.02em;color:var(--ink)}.hm-hi b{color:var(--pet3)}
[data-theme=dark] .hm-hi b{color:var(--acc)}
.hm-sub{color:var(--mt);margin-top:6px;font-size:13.5px}
.hm-st{display:flex;align-items:center;gap:10px;font:700 11px var(--ff);letter-spacing:.14em;text-transform:uppercase;color:var(--mt);margin:24px 4px 16px;animation:hmIn .6s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:calc(var(--i)*70ms + 60ms)}
.hm-st::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--cbd),transparent)}
.hm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 10px;justify-items:center}
@media(min-width:620px){.hm-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:960px){.hm-grid{grid-template-columns:repeat(auto-fill,200px);justify-content:start;gap:34px 30px}}
.hm-it{--d:108px;appearance:none;border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;width:100%;max-width:210px;position:relative}
html[data-device=desktop] .hm-it,html[data-size=l] .hm-it{--d:128px}
.hm-it.busy{opacity:.55;pointer-events:none}
.hm-ring{position:relative;width:var(--d);height:var(--d);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 22%,#10606f 0,#08404c 55%,#052c35 100%);box-shadow:0 12px 28px #00000055,inset 0 0 0 1px #17697a;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.hm-orb{position:absolute;inset:-5px;width:calc(100% + 10px);height:calc(100% + 10px);animation:hmSpin 22s linear infinite;pointer-events:none}
.hm-orb .o1{fill:none;stroke:var(--ac);stroke-width:1.6;stroke-dasharray:230 110;stroke-linecap:round;opacity:.9}
.hm-orb .o2{fill:none;stroke:var(--ac);stroke-width:1;opacity:.28}
.hm-orb .dt{fill:var(--card);stroke:var(--ac);stroke-width:1.6}
.hm-ic{width:42%;height:42%;color:#f1fffc;filter:drop-shadow(0 2px 6px #0006);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.hm-ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hm-lb{position:relative;margin-top:calc(var(--d)*-.17);padding:8px 14px;border-radius:99px;background:#fff;border:1px solid var(--cbd);color:#06303a;font:800 13px/1.15 var(--ff);letter-spacing:-.005em;box-shadow:0 6px 16px #0000004d;max-width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-theme=dark] .hm-lb{background:#f4fffd;border-color:transparent}
.hm-sm{display:block;margin-top:8px;color:var(--mt);font-size:11.5px;line-height:1.3;text-align:center;max-width:170px}
.hm-it:hover .hm-ring,.hm-it:focus-visible .hm-ring{transform:translateY(-5px);box-shadow:0 18px 36px #00000066,0 0 0 1px var(--ac),0 0 28px #2de2c933}
.hm-it:hover .hm-ic{transform:scale(1.08)}.hm-it:active .hm-ring{transform:scale(.96)}.hm-it:focus-visible{outline:none}
#app.sec-one .two{display:block}
/* efectos de entrada */
html:not([data-fx]) .hm-it,html[data-fx=arc] .hm-it{animation:hmArcX 1.9s cubic-bezier(.25,.6,.3,1) backwards,hmArcY 1.9s linear backwards,hmFade .35s ease backwards;animation-delay:calc(var(--i)*90ms + 250ms)}
html:not([data-fx]) .hm-it .hm-lb,html[data-fx=arc] .hm-it .hm-lb{animation:hmPop .45s cubic-bezier(.2,1.4,.4,1) backwards;animation-delay:calc(var(--i)*90ms + 2000ms)}
html:not([data-fx]) .hm-it .hm-sm,html[data-fx=arc] .hm-it .hm-sm{animation:hmFade .5s ease backwards;animation-delay:calc(var(--i)*90ms + 2150ms)}
html[data-fx=slide] .hm-it{animation:hmSlide 1.1s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:calc(var(--i)*300ms + 250ms)}
html[data-fx=roll] .hm-it{animation:hmFly 1.1s cubic-bezier(.22,1.15,.36,1) backwards;animation-delay:calc(var(--i)*300ms + 250ms)}
html[data-fx=roll] .hm-it .hm-lb{animation:hmPop .45s cubic-bezier(.2,1.4,.4,1) backwards;animation-delay:calc(var(--i)*300ms + 1050ms)}
html[data-fx=drop] .hm-it{animation:hmDrop 1.25s ease-in backwards;animation-delay:calc(var(--i)*170ms + 200ms)}
html[data-fx=zoom] .hm-it{animation:hmZoom .75s cubic-bezier(.2,1.3,.4,1) backwards;animation-delay:calc(var(--i)*150ms + 200ms)}
html[data-fx=flip] .hm-it{animation:hmFlip .95s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:calc(var(--i)*180ms + 200ms)}
html[data-fx=fan] .hm-it{transform-origin:0 100%;animation:hmFan 1s cubic-bezier(.2,.9,.25,1.1) backwards;animation-delay:calc(var(--i)*170ms + 200ms)}
@keyframes hmIn{from{opacity:0;transform:translateX(-84px) scale(.92)}to{opacity:1;transform:none}}
@keyframes hmSpin{to{transform:rotate(360deg)}}
@keyframes hmArcX{from{translate:-115vw 0}to{translate:0 0}}
@keyframes hmArcY{0%{transform:translateY(150px);animation-timing-function:cubic-bezier(.1,.5,.4,1)}45%{transform:translateY(-190px);animation-timing-function:cubic-bezier(.6,0,.9,.7)}100%{transform:translateY(0)}}
@keyframes hmSlide{from{opacity:0;transform:translateX(-170px) scale(.9)}to{opacity:1;transform:none}}
@keyframes hmFly{0%{opacity:0;transform:translateX(-115vw) rotate(-540deg)}12%{opacity:1}100%{opacity:1;transform:none}}
@keyframes hmPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes hmFade{from{opacity:0}to{opacity:1}}
@keyframes hmDrop{0%{opacity:0;transform:translateY(-120vh)}55%{opacity:1;transform:translateY(0)}70%{transform:translateY(-34px)}84%{transform:translateY(0)}92%{transform:translateY(-10px)}100%{transform:none}}
@keyframes hmZoom{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:scale(1)}}
@keyframes hmFlip{from{opacity:0;transform:perspective(700px) rotateY(-110deg) translateX(-40px)}to{opacity:1;transform:perspective(700px) rotateY(0)}}
@keyframes hmFan{from{opacity:0;transform:translateX(-70vw) rotate(-70deg)}to{opacity:1;transform:none}}
/* transiciones al cambiar de pantalla */
@keyframes vwIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes vwFade{from{opacity:0}to{opacity:1}}
@keyframes hmFadeOnly{from{opacity:0}to{opacity:1}}
#app>.card:not(#hm),#app>.sum,#app>.tools,#app>.tiles,#app>.two{animation:vwIn .32s cubic-bezier(.2,.8,.2,1) both}
/* Transición suave / Sin movimiento: solo desvanecer */
html[data-fx=fade] .hm-it{animation:hmFadeOnly .5s ease backwards;animation-delay:calc(var(--i)*80ms + 60ms)}
html[data-fx=fade] .hm-it .hm-lb,html[data-fx=fade] .hm-it .hm-sm{animation:none}
html[data-fx=fade] .hm-hero,html[data-fx=fade] .hm-st{animation:hmFadeOnly .45s ease backwards}
html[data-fx=fade] .hm-orb,html[data-nomove] .hm-orb{animation:none}
html[data-fx=fade] #app>.card:not(#hm),html[data-fx=fade] #app>.sum,html[data-fx=fade] #app>.tools,html[data-fx=fade] #app>.tiles,html[data-fx=fade] #app>.two,
html[data-fx=none] .hm-it,html[data-fx=none] .hm-hero,html[data-fx=none] .hm-st,html[data-fx=none] .hm-orb,html[data-nomove][data-fx=none] .hm-it{animation:none}
html[data-fx=none] #app>.card,html[data-fx=none] #app>.sum,html[data-fx=none] #app>.tools,html[data-fx=none] #app>.tiles,html[data-fx=none] #app>.two{animation:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
#hmHome{padding:30px 6px 30px}
#hmHome .hm-st:first-child{margin-top:4px}
.dtn{color:var(--mt);font-size:12px}
/* configuración */
.dpr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;margin:8px 0;border:1px solid var(--cbd);border-radius:14px;cursor:pointer}.dpr:active{opacity:.7}.dpr b{display:block;font-size:16px}.dpr small{display:block;color:var(--mt);font-size:12px;margin-top:2px}.dpq{text-align:right}.dps{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.dps .sc{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);border:1px solid var(--cbd);color:var(--ink)}.dpq b{color:var(--acc)}
.stsheet{position:fixed;inset:0;z-index:200;background:#000a;display:flex;align-items:flex-end;justify-content:center}
.stbox{width:100%;max-width:520px;max-height:82vh;overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--cbd);border-radius:20px 20px 0 0;padding:8px 12px calc(env(safe-area-inset-bottom) + 16px)}
.sthd{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 10px}.sthd b{font-size:17px}
.cfg-lbl{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mt);margin:6px 6px 8px}
.cfg-fx{display:flex;flex-direction:column;gap:8px;margin:0 6px}
.cfg-fx button{display:block;text-align:left;font:700 14px 'Inter',sans-serif;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--zb);color:var(--ink);cursor:pointer}
.cfg-fx button small{display:block;font-weight:500;color:var(--mt);margin-top:3px;font-size:12px}
.cfg-fx button.on{background:var(--pet);color:#fff;border-color:var(--pet)}.cfg-fx button.on small{color:#d6f3ef}
.cfg-chk{display:flex;gap:12px;align-items:flex-start;margin:14px 6px 6px;padding:12px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--zb);cursor:pointer}
.cfg-chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--pet3)}
.cfg-chk b{display:block;font:700 14px 'Inter',sans-serif}
.cfg-chk small{display:block;color:var(--mt);font-size:12px;margin-top:3px;font-weight:500;line-height:1.35}
</style>

  <div class="cfg-lbl">Efecto de entrada del menú</div><div id="cfgFx" class="cfg-fx"></div>
  <label class="cfg-chk"><input type="checkbox" id="cfgNoMove"><span><b>Sin movimiento</b><small>Detiene solo el giro alrededor de los iconos. Las transiciones y efectos siguen normales. Para detener todo, usa «Sin animación».</small></span></label>
  <div style="margin:10px 6px 4px;font-size:12.5px;color:var(--mt)">Se guarda en este equipo. Al elegir uno se ve de inmediato en el menú.</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import{getDatabase,ref,get}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

const FB={apiKey:"AIzaSyCn7bUx8PdK-1TCmOnffWJYLouC5vdGMIE",authDomain:"westland-marcaciones.firebaseapp.com",projectId:"westland-marcaciones",databaseURL:"https://westland-marcaciones-default-rtdb.firebaseio.com"};
const CMPB='meta_v1/comprador';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US');
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const fdt=ts=>ts?new Date(ts).toLocaleString('es',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const ST={D:'Despachado',R:'Recibido'},SP='Sin proveedor';
const AUTO_LBL='Pedido automático (reposición)';
const tyCls=t=>({[AUTO_LBL]:'A','Túnel manual':'U','Proforma':'P','Cliente':'C'}[t]||'');

const TK='cmpTheme';
const setTheme=t=>{document.documentElement.dataset.theme=t;$('tg').textContent=t==='dark'?'☀ Claro':'☾ Oscuro';try{localStorage.setItem(TK,t)}catch(e){}};
setTheme(document.documentElement.dataset.theme==='light'?'light':'dark');
$('tg').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
let SN={},db,TOK='',IDX={},PL=null,ROWS=[],VIEW=[],SORT={k:'t',d:1},BUSY=false;

const COLS=[
 {k:'t',h:'Tienda'},{k:'tr',h:'N.º de documento'},{k:'v',h:'Proveedor'},{k:'e',h:'Estilo'},{k:'p',h:'Producto',mono:1},{k:'d',h:'Descripción',w:380},{k:'q',h:'Piezas',n:1},
 {k:'td',h:'Tipo de documento'},{k:'cn',h:'Cliente'},{k:'ty',h:'Tipología'},{k:'rc',h:'Recibo'}
];
/* Guía de proveedores por prefijo de la descripción (primera palabra). Solo se usa cuando el sistema no encontró proveedor.
   Para agregar uno nuevo: PREFIJO:'NOMBRE DEL PROVEEDOR'. */
const NASA='S.I - NASA ZONA LIBRE PANAMA, S.A.',AMER='AMERICAN PLASTIC TOYS INC.',RODEO='S.I - RODEO IMPORT,S.A.';
const GUIA_PROV={
  ORL:'S.I - ORILAT',
  HD:'S.I - H DAYA INTERNACIONAL/VMD DAYA/YIWU',
  APT:AMER,ATP:AMER,
  RD:RODEO,RDO:RODEO,
  WF:'S.I - WINFUN',
  RTB:'S.I - RED TOOLBOX LTD',
  PPT:'S.I - PHI PHI TOYS',
  HW:NASA,KIP:NASA,BRB:NASA,LLO:NASA,SNC:NASA,JPC:NASA,MNC:NASA,CRB:NASA,FP:NASA,DNY:NASA,CNL:NASA
};
const prefOf=d=>String(d||'').trim().split(/\s+/)[0].toUpperCase().replace(/[^A-Z0-9ÁÉÍÓÚÑ]/g,'');
// Tipología: todo lo que sale de recibo o de túnel (PDF "distribución") es "Túnel de distribución"; Automático, Túnel manual y Proforma se mantienen aparte.
const tyN=t=>(!t||t==='Recibo'||t==='Túnel'||t==='Tunel')?'Túnel de distribución':(t==='Automático'||t==='Pedido automático')?AUTO_LBL:t;
const norm1=r=>{let v=String(r.v||SP).replace(/\s+/g,' ').trim();
  if(v===SP&&r.p){const g=GUIA_PROV[prefOf(r.d)];if(g)v=g}
  return{...r,ty:tyN(r.ty),v,rc:r.rc||'',cn:r.cn||String(SN[r.t]||'').toUpperCase(),tr:String(r.tr||'').replace(/\s+/g,''),td:String(r.td||(r.t==='Cristal'?'Proforma':'Transferencia')).replace(/^Pro\s+forma$/i,'Proforma')}};

window.addEventListener('hashchange',()=>{if(TOK)route()});
function route(){const [t,id]=location.hash.slice(1).split('/');if(t!==TOK)return;
  if(!id)return showHome();if(id==='_list'){showHome();openDsp();return}if(id==='_docs')return showDocs();if(id==='_prods')return showProds();if(id==='_kpi')return showKpi();openPL(id)}
function fail(m){$('bk').classList.add('hide');$('sub').textContent='';$('app').innerHTML=`<div class="card msg err"><b>${esc(m)}</b><br><span style="color:var(--mt)">Pide que te reenvíen el enlace.</span></div>`}

async function init(){
  const t=(location.hash.slice(1).split('/')[0]||new URLSearchParams(location.search).get('t')||'').trim();
  if(!/^[A-Za-z0-9_-]{16,64}$/.test(t)){fail('Enlace no válido');return}
  TOK=t;
  try{
    const app=initializeApp(FB),auth=getAuth(app);db=getDatabase(app);
    if(!auth.currentUser)await signInAnonymously(auth);
    IDX=(await get(ref(db,`${CMPB}/${TOK}/idx`))).val()||{};
    if(!Object.keys(IDX).length){fail('Este enlace no tiene packing list publicados o fue desactivado');return}
    route();
  }catch(e){fail('No se pudo abrir ('+(e.code||e.message)+')')}
}

/* ---------- LISTA (más reciente arriba) ---------- */
function showList(){
  PL=null;SEC=null;$('app').classList.remove('sec-one');$('bk').classList.remove('hide');$('bk').textContent='← Menú';$('bk').onclick=()=>{location.hash=TOK};$('ttl').textContent='Despacho · elige el packing list';
  const all=Object.entries(IDX).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0));
  $('sub').textContent=`${all.length} packing list · ordenados por fecha de despacho, el más reciente primero`;
  const tp=all.reduce((a,[,v])=>a+(v.tp||0),0);
  $('app').innerHTML=`<div class="sum">
      <div><b>${fmt(all.length)}</b><span>Packing list</span></div>
      <div><b>${fmt(all.filter(([,v])=>v.st==='R').length)}</b><span>Recibidos</span></div>
      <div><b>${fmt(all.filter(([,v])=>v.st!=='R').length)}</b><span>En tránsito</span></div>
      <div><b>${fmt(tp)}</b><span>Piezas</span></div></div>
    <div class="tools" style="margin-bottom:14px"><input type="search" id="lq" placeholder="Buscar packing list o tienda (ej. EMB-0009, S4)…">
      <select id="ls" style="flex:0 1 200px"><option value="">Todos los estados</option><option value="D">Despachado</option><option value="R">Recibido</option></select></div>
    <div class="tiles" id="lst"></div>`;
  const draw=()=>{const q=norm($('lq').value),s=$('ls').value;
    const r=all.filter(([,v])=>(!s||(v.st==='R'?'R':'D')===s)&&(!q||norm(v.num+' '+(v.sl||'')).includes(q)));
    $('lst').innerHTML=r.map(([id,v])=>{const rc=v.st==='R';
      const ch=v.sl?String(v.sl).split(',').filter(Boolean).map(x=>`<span class="sc">${esc(x)}</span>`).join(''):`<span>${fmt(v.ns)} tienda(s)</span>`;
      return `<div class="tile ${rc?'':'tr'}" data-id="${esc(id)}"><div class="hd"><b>${esc(v.num)}</b><small>${rc?'Recibido':'En tránsito · despachado'}</small></div>
        <div class="bd"><div class="big"><div><b>${v.tp?fmt(v.tp):'—'}</b><span>Piezas</span></div><div><b>${fmt(v.tf)}</b><span>Docs.</span></div></div>
          Despachado <b class="d">${fdt(v.ts)}</b><br>${rc?'Recibido <b class="d">'+fdt(v.rts)+'</b>':'Pendiente de recibir'}</div>
        <div class="st"><span class="lb">Tiendas</span>${ch}</div></div>`}).join('')||'<div class="msg" style="grid-column:1/-1">Sin resultados</div>'};
  $('lq').oninput=draw;$('ls').onchange=draw;draw();
  $('lst').onclick=e=>{const c=e.target.closest('.tile');if(c&&c.dataset.id)location.hash=TOK+'/'+c.dataset.id};
}

/* ---------- DETALLE ---------- */
async function openPL(id){
  $('app').innerHTML='<div class="card msg">Cargando packing list…</div>';
  try{const v=(await get(ref(db,`${CMPB}/${TOK}/pl/${id}`))).val();
    if(!v){fail('Ese packing list ya no está disponible');return}
    PL=v;SN={};(v.stores||[]).forEach(s=>{if(s.t&&s.tn)SN[s.t]=s.tn});ROWS=Object.values(v.rows||{}).map(norm1);SORT={k:'t',d:1};paintPL()}
  catch(e){fail('No se pudo abrir ('+(e.code||e.message)+')')}
}
const grp=(rows,f)=>{const o={};rows.forEach(r=>{const k=f(r),a=o[k]=o[k]||{k,q:0,l:0,rf:new Set()};a.q+=r.q||0;a.l++;if(r.p)a.rf.add(r.p)});return Object.values(o).sort((a,b)=>b.q-a.q)};

function paintPL(){
  const v=PL,rc=v.st==='R',tp=Math.max(1,v.tp||0);
  $('bk').classList.remove('hide');$('bk').onclick=()=>{location.hash=TOK};
  $('ttl').textContent=`Packing list ${v.num}`;
  $('sub').textContent=`${ST[v.st]||'Despachado'} · despachado ${fdt(v.ts)}${rc?' · recibido '+fdt(v.rts):''}`;
  const refs=new Set(ROWS.map(r=>r.p).filter(Boolean)).size,parc=new Set(ROWS.filter(r=>r.pa).map(r=>r.t+'|'+r.tr)).size;
  const opt=k=>[...new Set(ROWS.map(r=>r[k]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'es',{numeric:true}));
  const sel=(id,l,a)=>`<select id="${id}"><option value="">${l}</option>${a.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`;
  const byV=grp(ROWS,r=>r.v),byT=grp(ROWS,r=>r.ty);
  const tieH=`<div class="rsb"><h2>Distribución por tienda</h2>${v.stores.map(s=>{const pc=(s.pz||0)/tp*100;return `<div class="sb"><div class="lb">${esc(s.t)}${s.tn?'<br><small style="color:var(--mt);font-weight:400">'+esc(s.tn)+'</small>':''}</div><div class="tr"><i style="width:${Math.max(1,pc).toFixed(1)}%"></i></div><div class="vl"><b>${pc.toFixed(1)}%</b> · ${fmt(s.pz)} pzas · ${fmt(s.tf)} doc.</div></div>`}).join('')}</div>`;
  const proH=`<div class="rsb"><h2>Distribución por proveedor</h2>${byV.map(g=>{const pc=g.q/tp*100;return `<div class="sb"><div class="lb ${g.k===SP?'sp':''}">${esc(g.k)}</div><div class="tr"><i style="width:${Math.max(1,pc).toFixed(1)}%"></i></div><div class="vl"><b>${pc.toFixed(1)}%</b> · ${fmt(g.q)} pzas · ${fmt(g.rf.size)} ref.</div></div>`}).join('')}
    <div class="info">Tipología: ${byT.map(g=>`<span class="chip ty ${tyCls(g.k)}">${esc(g.k)} · ${fmt(g.q)} pzas</span>`).join(' ')}</div></div>`;
  const RSV={all:tieH+proH,tie:tieH,pro:proH};
  $('app').innerHTML=`
  <div class="card" data-sec="res"><div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div><span class="chip ${rc?'R':'D'}">${rc?'Recibido':'Despachado'}</span></div>
    <div style="display:flex;gap:8px"><button class="btn" id="xl">Excel</button><button class="btn sec" id="pdf">PDF</button></div></div>
    <div class="kpis">${[['Piezas',v.tp],['Referencias',refs],['Tiendas',v.stores.length],['Documentos',v.tf]].map(([l,n])=>`<div class="kpi"><b>${fmt(n)}</b><span>${l}</span></div>`).join('')}</div>
    <div class="info">Informativo: ${fmt(v.tb)} bultos · ${fmt((v.cams||[]).length)} camión(es) · Preparó ${esc(v.prep||'—')} · Despachó ${esc(v.dby||'—')}${rc&&v.rby?' · Recibió '+esc(v.rby):''}</div>
    <div class="tools" style="margin:14px 0 4px"><label style="font-weight:700;font-size:13px">Ver resumen:</label><select id="rsv"><option value="all">Todos</option><option value="tie">Por tienda</option><option value="pro">Por proveedor</option></select></div>
    <div id="rsBody">${RSV.all}</div>
    ${parc?`<div class="info warn">${parc} transferencia(s) viajaron parcialmente en este packing list (marcadas “Parcial”); sus piezas son las de la transferencia completa.</div>`:''}</div>

  <div class="card" data-sec="det"><h2>Detalle de productos</h2>
    <div class="tools"><input type="search" id="q" placeholder="Buscar código, estilo, descripción, proveedor…">${sel('ft','Todas las tiendas',opt('t'))}${sel('fd','Todo tipo de documento',opt('td'))}${sel('fr','Todos los documentos',opt('tr'))}${sel('fy','Toda tipología',opt('ty'))}${sel('fv','Todos los proveedores',opt('v'))}<input type="number" id="fm" min="0" placeholder="Pzas ≥"><button class="btn sec" id="clr">Limpiar</button></div>
    <div class="cnt" id="cnt"></div>
    <div class="tw"><table><thead><tr id="hd"></tr></thead><tbody id="tb"></tbody><tfoot><tr id="tf"></tr></tfoot></table></div></div>`;
  $('hd').innerHTML=COLS.map(c=>`<th data-k="${c.k}" class="${c.n?'n':''}"${c.w?` style="min-width:${c.w}px"`:''}>${c.h}<span id="ar_${c.k}" style="margin-left:4px"></span></th>`).join('');
  $('hd').onclick=e=>{const th=e.target.closest('th');if(!th)return;const k=th.dataset.k;SORT=SORT.k===k?{k,d:-SORT.d}:{k,d:1};render()};
  ['q','ft','fd','fr','fy','fv','fm'].forEach(id=>$(id).addEventListener(id==='q'||id==='fm'?'input':'change',render));
  $('clr').onclick=()=>{['q','ft','fd','fr','fy','fv','fm'].forEach(id=>$(id).value='');render()};
  $('rsv').onchange=()=>{$('rsBody').innerHTML=RSV[$('rsv').value]};
  $('xl').onclick=excel;$('pdf').onclick=pdf;
  render();hmInit();
}

function render(){
  const q=norm($('q').value).split(/\s+/).filter(Boolean),ft=$('ft').value,fr=$('fr').value,fy=$('fy').value,fd=$('fd').value,fv=$('fv').value,fm=+$('fm').value||0;
  VIEW=ROWS.filter(r=>{
    if(ft&&r.t!==ft)return false;if(fr&&r.tr!==fr)return false;if(fy&&r.ty!==fy)return false;if(fd&&r.td!==fd)return false;if(fv&&r.v!==fv)return false;if(fm&&(r.q||0)<fm)return false;
    if(q.length){const h=norm([r.t,r.tn,r.tr,r.cn,r.td,r.ty,r.rc,r.v,r.e,r.p,r.d,r.u].join(' '));if(!q.every(w=>h.includes(w)))return false}
    return true});
  const k=SORT.k,d=SORT.d,num=COLS.find(c=>c.k===k).n;
  VIEW.sort((a,b)=>d*(num?(a[k]||0)-(b[k]||0):String(a[k]||'').localeCompare(String(b[k]||''),'es',{numeric:true})));
  COLS.forEach(c=>{const a=$('ar_'+c.k);if(a)a.textContent=c.k===k?(d>0?'▲':'▼'):''});
  $('cnt').textContent=`${fmt(VIEW.length)} de ${fmt(ROWS.length)} líneas`;
  $('tb').innerHTML=VIEW.length?VIEW.map(r=>`<tr>${COLS.map(c=>{const v=r[c.k];let s;
    if(c.k==='t')s=`<span class="chip T">${esc(v)}</span>`;
    else if(c.k==='tr')s=esc(v||'—')+(r.pa?'<span class="chip pa">Parcial</span>':'');
    else if(c.k==='td')s=`<span class="chip ty">${esc(v)}</span>`;
    else if(c.k==='ty')s=`<span class="chip ty ${tyCls(v)}">${esc(v)}</span>`;
    else if(c.k==='v')s=v===SP?`<span class="sp">${SP}</span>`:esc(v);
    else if(c.k==='q')s=fmt(v);else s=esc(v||(c.k==='rc'?'—':''));
    return `<td class="${c.n?'n':''} ${c.mono?'mono':''}"${c.w?` style="min-width:${c.w}px;white-space:normal"`:''}>${s}</td>`}).join('')}</tr>`).join(''):`<tr><td colspan="${COLS.length}" class="msg">Sin resultados</td></tr>`;
  const tq=VIEW.reduce((a,r)=>a+(r.q||0),0);$('tf').innerHTML=COLS.map((c,i)=>c.k==='q'?`<td class="n">${fmt(tq)}</td>`:i===0?`<td><b>TOTAL (${fmt(VIEW.length)} líneas)</b></td>`:'<td></td>').join('');
}

/* ---------- EXCEL (ExcelJS: estilos, filtros, formato tabla) ---------- */
const sortRows=a=>[...a].sort((x,y)=>String(x.t).localeCompare(String(y.t),'es',{numeric:true})||String(x.tr).localeCompare(String(y.tr),'es',{numeric:true})||String(x.p).localeCompare(String(y.p),'es',{numeric:true}));
async function excel(){
  if(!window.ExcelJS){alert('No cargó la librería de Excel. Revisa tu conexión.');return}
  const b=$('xl');b.disabled=true;
  try{
    const v=PL,tp=Math.max(1,v.tp||0),wb=new ExcelJS.Workbook();wb.creator='Westland';wb.created=new Date();
    const NAVY='FF06303A',PET='FF08404C',LIGHT='FFEAF1F8',ZEB='FFF5F8FC',W='FFFFFFFF',GR='FF5A6B7A',LN='FFC9D6E4';
    const side={style:'thin',color:{argb:LN}},bd={top:side,left:side,bottom:side,right:side};
    const fill=c=>({type:'pattern',pattern:'solid',fgColor:{argb:c}});
    const band=(ws,r,text,last,color,size)=>{ws.mergeCells(r,1,r,last);const c=ws.getCell(r,1);c.value=text;c.font={name:'Calibri',bold:true,size,color:{argb:W}};c.fill=fill(color);c.alignment={vertical:'middle',horizontal:'left',indent:1};ws.getRow(r).height=size+14};
    const head=(ws,r,heads,al)=>{const row=ws.getRow(r);row.height=24;heads.forEach((h,i)=>{const c=row.getCell(i+1);c.value=h;c.font={name:'Calibri',bold:true,size:11,color:{argb:W}};c.fill=fill(NAVY);c.alignment={vertical:'middle',horizontal:al?(h==='Piezas'?'right':'left'):'center',wrapText:!al,indent:al?1:0};c.border=bd})};
    const body=(ws,r,vals,fm,i)=>{const row=ws.getRow(r);vals.forEach((x,j)=>{const c=row.getCell(j+1);c.value=x;c.font={name:'Calibri',size:10.5};c.border=bd;if(i%2)c.fill=fill(ZEB);if(fm&&fm[j])c.numFmt=fm[j];c.alignment={vertical:'top',horizontal:typeof x==='number'?'right':'left',wrapText:true}})};
    const total=(ws,r,vals,fm)=>{const row=ws.getRow(r);vals.forEach((x,j)=>{const c=row.getCell(j+1);c.value=x;c.font={name:'Calibri',bold:true,size:11,color:{argb:W}};c.fill=fill(PET);c.border=bd;if(fm&&fm[j])c.numFmt=fm[j];c.alignment={horizontal:typeof x==='number'||(x&&x.formula)?'right':'left',vertical:'middle'}})};
    const sub=(ws,r,text,last)=>{ws.mergeCells(r,1,r,last);const c=ws.getCell(r,1);c.value=text;c.font={name:'Calibri',bold:true,size:12,color:{argb:PET}};c.border={bottom:{style:'medium',color:{argb:PET}}};ws.getRow(r).height=22};
    const rowsAll=sortRows(ROWS),refs=new Set(ROWS.map(r=>r.p).filter(Boolean)).size;

    /* Hoja 1: Resumen */
    const s1=wb.addWorksheet('Resumen',{views:[{showGridLines:false}]});
    s1.columns=[{width:30},{width:26},{width:16},{width:14},{width:14},{width:34}];
    band(s1,1,'REPORTE DE DESPACHO A TIENDAS',6,NAVY,16);
    band(s1,2,`Packing list ${v.num}  ·  ${ST[v.st]||'Despachado'}`,6,PET,11);
    const kv=[['Packing list',v.num],['Estado',ST[v.st]||'Despachado'],['Despachado',fdt(v.ts)],['Recibido',v.st==='R'?fdt(v.rts):'—'],['Preparó',v.prep||'—'],['Despachó',v.dby||'—']];
    kv.forEach(([k,x],i)=>{const r=4+i;const a=s1.getCell(r,1),c=s1.getCell(r,2);a.value=k;a.font={bold:true,color:{argb:GR}};a.fill=fill(LIGHT);a.border=bd;c.value=x;c.border=bd;c.alignment={horizontal:'left'};s1.mergeCells(r,2,r,3)});
    let r=11;sub(s1,r,'Indicadores',6);r++;
    head(s1,r,['Indicador','Valor']);r++;
    [['Piezas',v.tp],['Referencias',refs],['Tiendas',v.stores.length],['Documentos',v.tf]].forEach((x,i)=>{body(s1,r,x,[null,'#,##0'],i);r++});
    [['Bultos (informativo)',v.tb],['Camiones (informativo)',(v.cams||[]).length]].forEach(x=>{body(s1,r,x,[null,'#,##0'],0);s1.getCell(r,1).font={italic:true,color:{argb:GR},size:10.5};s1.getCell(r,2).font={italic:true,color:{argb:GR},size:10.5};r++});
    r+=1;sub(s1,r,'Distribución por tienda',6);r++;
    head(s1,r,['Tienda','Nombre','Documentos','Piezas','% del total','Participación']);r++;

  if(ALL)return ALL;
  const ids=Object.keys(IDX),out=[];let done=0;
  $('app').innerHTML=`<div class="card msg" id="ldg">Cargando despachos… 0/${ids.length}</div>`;
  const keep=SN;
  await Promise.all(ids.map(async id=>{
    try{const v=(await get(ref(db,`${CMPB}/${TOK}/pl/${id}`))).val();
      if(v){SN={};(v.stores||[]).forEach(x=>{if(x.t&&x.tn)SN[x.t]=x.tn});
        Object.values(v.rows||{}).forEach(r=>out.push({...norm1(r),pid:id,pn:v.num||IDX[id].num,pts:v.ts||0}))}}catch(e){}
    done++;const l=$('ldg');if(l)l.textContent=`Cargando despachos… ${done}/${ids.length}`}));
  SN=keep;ALL=out;return ALL}
const here=h=>location.hash.slice(1)===TOK+'/'+h;

async function showDocs(){
  subView('Documentos','Transferencias y proformas de todos los despachos');
  const A=await loadAll();if(!here('_docs'))return;
  const m=new Map();
  A.forEach(r=>{const k=r.td+'|'+r.tr+'|'+r.t;let o=m.get(k);if(!o){o={td:r.td,tr:r.tr,t:r.t,cn:r.cn,q:0,pl:new Map(),pa:false};m.set(k,o)}o.q+=r.q||0;o.pl.set(r.pid,r.pn);if(r.pa)o.pa=true});
  const D=[...m.values()],tipos=[...new Set(D.map(x=>x.td))].sort();
  $('app').innerHTML=`<div class="card"><div class="tools"><input type="search" id="dq" placeholder="Buscar n.º de documento, tienda, cliente o packing list…"><select id="dt"><option value="">Todos los tipos</option>${tipos.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>
    <div class="cnt" id="dcnt"></div><div class="tw"><table style="min-width:760px"><thead><tr><th>Tipo</th><th>N.º documento</th><th>Tienda</th><th>Cliente</th><th class="n">Piezas</th><th>Packing list</th></tr></thead><tbody id="dtb"></tbody></table></div></div>`;
  const draw=()=>{const q=norm($('dq').value).split(/\s+/).filter(Boolean),ty=$('dt').value;
    const R=D.filter(x=>(!ty||x.td===ty)&&(!q.length||q.every(w=>norm([x.tr,x.t,x.cn,x.td,[...x.pl.values()].join(' ')].join(' ')).includes(w))))
      .sort((a,b)=>String(a.td).localeCompare(String(b.td))||String(b.tr).localeCompare(String(a.tr),'es',{numeric:true}));
    $('dcnt').textContent=`${fmt(R.length)} de ${fmt(D.length)} documentos`+(R.length>300?' · mostrando los primeros 300, afina la búsqueda':'');
    $('dtb').innerHTML=R.slice(0,300).map(x=>`<tr data-id="${esc([...x.pl.keys()][0])}" style="cursor:pointer"><td><span class="chip ty">${esc(x.td)}</span></td><td>${esc(x.tr||'—')}${x.pa?'<span class="chip pa">Parcial</span>':''}</td><td><span class="chip T">${esc(x.t)}</span></td><td>${esc(x.cn)}</td><td class="n">${fmt(x.q)}</td><td>${esc([...x.pl.values()].join(', '))}</td></tr>`).join('')||'<tr><td colspan="6" class="msg">Sin resultados</td></tr>'};
  $('dq').oninput=draw;$('dt').onchange=draw;draw();
  $('dtb').onclick=e=>{const r=e.target.closest('tr[data-id]');if(r)location.hash=TOK+'/'+r.dataset.id}}

async function showProds(){
  subView('Productos','Busca un producto en todos los despachos');
  const A=await loadAll();if(!here('_prods'))return;
  $('app').innerHTML=`<div class="card"><div class="tools"><input type="search" id="pq" placeholder="Código, estilo, descripción o código de barras…"></div>
    <div class="cnt" id="pcnt"></div><div class="tw"><table style="min-width:860px"><thead><tr><th>Producto</th><th>Estilo</th><th>Descripción</th><th>Tienda</th><th>Documento</th><th class="n">Piezas</th><th>Packing list</th></tr></thead><tbody id="ptb"></tbody></table></div></div>`;
  const draw=()=>{const q=norm($('pq').value).split(/\s+/).filter(Boolean);
    if(!q.length){$('pcnt').textContent=`${fmt(A.length)} líneas en ${fmt(Object.keys(IDX).length)} despachos · escribe para buscar`;$('ptb').innerHTML='<tr><td colspan="7" class="msg">Escribe un código, estilo o descripción</td></tr>';return}
    const R=A.filter(r=>q.every(w=>norm([r.p,r.e,r.d,r.u].join(' ')).includes(w)));
    $('pcnt').textContent=`${fmt(R.length)} líneas · ${fmt(R.reduce((a,r)=>a+(r.q||0),0))} piezas`+(R.length>400?' · mostrando las primeras 400':'');
    $('ptb').innerHTML=R.slice(0,400).map(r=>`<tr data-id="${esc(r.pid)}" style="cursor:pointer"><td class="mono">${esc(r.p)}</td><td>${esc(r.e)}</td><td>${esc(r.d)}</td><td><span class="chip T">${esc(r.t)}</span></td><td>${esc(r.tr||'—')}</td><td class="n">${fmt(r.q)}</td><td>${esc(r.pn)}</td></tr>`).join('')||'<tr><td colspan="7" class="msg">Sin resultados</td></tr>'};
  $('pq').oninput=draw;draw();
  $('ptb').onclick=e=>{const r=e.target.closest('tr[data-id]');if(r)location.hash=TOK+'/'+r.dataset.id}}

function showKpi(){
  subView('KPIs','Resumen de todos los despachos');
  const all=Object.entries(IDX).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0)),tp=all.reduce((a,[,v])=>a+(v.tp||0),0),rec=all.filter(([,v])=>v.st==='R').length;
  const bars=(rows,mx,suf)=>rows.map(([l,n,extra])=>`<div class="sb"><div class="lb">${esc(l)}</div><div class="tr"><i style="width:${Math.max(1,n/Math.max(1,mx)*100).toFixed(1)}%"></i></div><div class="vl"><b>${fmt(n)}</b> ${suf}${extra?' · '+extra:''}</div></div>`).join('')||'<div class="msg">Sin datos</div>';
  const last=all.slice(0,12);
  const pm={};all.forEach(([,v])=>{if(!v.ts)return;const d=new Date(v.ts),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');pm[k]=(pm[k]||0)+(v.tp||0)});
  const meses=Object.entries(pm).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12);
  const ps={};all.forEach(([,v])=>String(v.sl||'').split(',').filter(Boolean).forEach(t=>{ps[t]=(ps[t]||0)+1}));
  const tiendas=Object.entries(ps).sort((a,b)=>b[1]-a[1]);
  $('app').innerHTML=`<div class="sum"><div><b>${fmt(all.length)}</b><span>Despachos</span></div><div><b>${fmt(rec)}</b><span>Recibidos</span></div><div><b>${fmt(all.length-rec)}</b><span>En tránsito</span></div><div><b>${fmt(tp)}</b><span>Piezas</span></div></div>
   <div class="two"><div class="card"><h2>Piezas por despacho (últimos 12)</h2>${bars(last.map(([,v])=>[v.num,v.tp||0,v.st==='R'?'Recibido':'En tránsito']),Math.max(...last.map(([,v])=>v.tp||0),1),'pzas')}</div>
   <div class="card"><h2>Piezas por mes</h2>${bars(meses.map(([k,n])=>[k,n]),Math.max(...meses.map(x=>x[1]),1),'pzas')}</div></div>
   <div class="card"><h2>Despachos por tienda</h2>${bars(tiendas.map(([t,n])=>[t,n]),Math.max(...tiendas.map(x=>x[1]),1),'despachos')}</div>`}
init();
</script>
