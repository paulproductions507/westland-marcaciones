<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#041f26"><title>Recepción · Frangipani</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#041f26;--bg2:#06303a;--sf:#0a3d49;--sf2:#0e4c5a;--bd:#17697a;--ac:#2de2c9;--ac2:#0fb5a8;--tx:#e9fbf8;--mt:#8fc3c6;--ok:#34e08a;--wn:#ffc857;--dn:#ff6b6b;--r:16px;--f:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#0b5b69 0,transparent 60%),var(--bg);color:var(--tx);font-family:var(--f);min-height:100%}
body{padding:env(safe-area-inset-top) 0 calc(60px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0}
.top{position:sticky;top:0;margin-top:calc(-1*env(safe-area-inset-top));z-index:20;background:linear-gradient(180deg,#06303aee,#06303acc);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:calc(env(safe-area-inset-top) + 22px) 14px 12px;display:flex;align-items:center;gap:8px}
.top .ttl{flex:1;min-width:0}.top h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top small{color:var(--mt);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border-radius:12px;padding:10px 14px;font:700 13px var(--f);cursor:pointer;background:var(--sf2);color:var(--tx);border:1px solid var(--bd)}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#02343a;border:0;box-shadow:0 6px 18px #2de2c93a}.btn.sm{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.4}.btn.glow{animation:gl 1.4s infinite}
.wrap{max-width:900px;margin:0 auto;padding:16px 14px}
.tabs{display:flex;gap:6px;margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1;white-space:nowrap;padding:12px 10px;border-radius:13px;background:var(--sf);border:1px solid var(--bd);color:var(--mt);font:700 13px var(--f);cursor:pointer}.tab.on{background:#2de2c91f;color:var(--ac);border-color:#2de2c966}
.card{background:linear-gradient(160deg,var(--sf),var(--bg2));border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.big{font:800 26px var(--f);color:var(--ac)}
.lbl,.slbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mt);font-weight:700}.slbl{margin:0 2px 8px}
.bar{height:16px;border-radius:99px;background:#02171c;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:99px;transition:width .5s}
.search{display:flex;gap:8px;align-items:center}
.sbox{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:#031a20;border:1px solid var(--bd);border-radius:12px;padding:0 12px;height:48px}.sbox:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px #2de2c91f}
.sbox input,.inp{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--tx);font:500 16px var(--f);height:100%}
.fld{width:100%;background:#031a20;border:1px solid var(--bd);border-radius:12px;padding:13px;color:var(--tx);font:500 16px var(--f);margin-bottom:10px;outline:0}.fld:focus{border-color:var(--ac)}
.msg{margin:8px 2px 0;font-size:13px;color:var(--mt)}.msg.err{color:var(--dn)}
.row{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--sf);margin-bottom:8px;cursor:pointer}.row:active{background:var(--sf2)}
.row .st{font:800 15px var(--f)}.row .ds{font-size:12.5px;color:var(--mt)}.row>div:first-child{flex:1;min-width:0}
.pill{font:800 11px var(--f);border-radius:99px;padding:4px 9px;white-space:nowrap}.p-ok{background:#34e08a26;color:var(--ok)}.p-wn{background:#ffc85726;color:var(--wn)}.p-no{background:#ffffff14;color:var(--mt)}.p-er{background:#ff6b6b26;color:var(--dn)}
.cam{display:flex;justify-content:space-between;align-items:center;margin:2px 0 10px;font-weight:700;font-size:14px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tile{border:2px solid var(--bd);border-radius:14px;overflow:hidden;background:linear-gradient(180deg,var(--sf2),#082f38);cursor:pointer;transition:.2s}
.tile .hd{padding:10px 4px;text-align:center;background:linear-gradient(135deg,#1f5f6c,#0b3f4b);font:800 16px var(--f)}.tile .bd{padding:6px;text-align:center;font-size:12px;color:var(--mt)}
.tile.ok{border-color:var(--ok);box-shadow:0 0 14px #34e08a40}.tile.ok .hd{background:linear-gradient(135deg,var(--ok),#0f9d58);color:#03281a}.tile.ok .bd{color:#fff}.tile.pop{animation:pop .55s}
.modal{position:fixed;inset:0;z-index:60;background:#000a;display:flex;align-items:flex-end;justify-content:center}
.modal>div{width:100%;max-width:640px;max-height:90vh;overflow:auto;background:var(--bg2);border:1px solid var(--bd);border-radius:20px 20px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
#ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;pointer-events:none}
.fl{position:relative;text-align:center;padding:22px 28px;border-radius:22px;background:#06303af5;border:2px solid var(--ok);box-shadow:0 20px 60px #000a,0 0 40px #34e08a55;animation:in .25s cubic-bezier(.2,1.4,.4,1);max-width:86vw}
.fl b{display:block;font-size:19px}.fl span{display:block;color:var(--mt);font-size:13px;margin-top:4px}
.fl.er{border-color:var(--dn);box-shadow:0 20px 60px #000a,0 0 40px #ff6b6b55;animation:in .25s,shake .4s .25s}.fl.dup{border-color:var(--wn);box-shadow:0 20px 60px #000a,0 0 40px #ffc85755}
.fl s{position:absolute;left:50%;top:38%;width:8px;height:8px;border-radius:2px;background:var(--c);animation:cf .9s var(--d) ease-out forwards}
.ic{width:84px;height:84px;display:block;margin:0 auto 8px}.cc,.ck{fill:none;stroke:var(--ok);stroke-linecap:round;stroke-linejoin:round;stroke-dashoffset:150;animation:dr .5s forwards}
.cc{stroke-width:3;stroke-dasharray:151}.ck{stroke-width:4;stroke-dasharray:150;animation-delay:.3s}
.er .cc,.er .ck{stroke:var(--dn)}.dup .cc,.dup .ck{stroke:var(--wn)}
@keyframes in{from{transform:scale(.6);opacity:0}}@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
@keyframes pop{40%{transform:scale(1.14)}}@keyframes gl{50%{box-shadow:0 0 0 8px #2de2c933}}
</style></head><body><div id="a"></div><div id="ov"></div>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import{getDatabase,ref as R,get,update,query,orderByKey,startAt}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
const FB={apiKey:"AIzaSyCn7bUx8PdK-1TCmOnffWJYLouC5vdGMIE",authDomain:"westland-marcaciones.firebaseapp.com",projectId:"westland-marcaciones",storageBucket:"westland-marcaciones.appspot.com",messagingSenderId:"477907187320",appId:"1:477907187320:web:c04ef5b3b8ff5773b99f8d",databaseURL:"https://westland-marcaciones-default-rtdb.firebaseio.com"};const app=initializeApp(FB),auth=getAuth(app),db=getDatabase(app);
const PB='meta_v1/consultas_palets',KEY='rec_sess',PK='rec_prog_',HORA=36e5,ADMINS=["provira","aalvarado","ihceballos","jthomas"],$=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fdt=t=>t?new Date(t).toLocaleString('es',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const dg=s=>String(s).replace(/\D/g,'');
let EM={},cur=null,chk={},extra=[],t0=0,ses=null,busy=false,tab='p',ft,AC;
const sess=()=>{try{const v=JSON.parse(localStorage.getItem(KEY)||'null');return v&&v.exp>Date.now()?v:null}catch(e){return null}};
const calc=e=>{const cams=Object.entries(e.cam||{}).map(([cid,c])=>({cid,chofer:c.chofer||'',placa:c.placa||'',pals:Object.entries(c.pal||{}).map(([id,v])=>({id,n:v.n,b:v.b||0})).sort((a,b)=>parseInt(dg(a.n))-parseInt(dg(b.n)))}));const all=cams.flatMap(c=>c.pals);return{cams,all,np:all.length,nb:all.reduce((t,p)=>t+p.b,0)}};
const u2e=u=>{const uu=String(u).toLowerCase();return ['aojo'].includes(uu)?`${uu}@saks.com.pa`:`westlandoutletjugueterianivel+${uu}@gmail.com`};
const salir=()=>{localStorage.removeItem(KEY);login()};
const top=(t,s,b,x)=>`<div class="top">${b?'<button class="btn sm" id="bk">←</button>':''}<div class="ttl"><h1>${t}</h1><small>${s}</small></div>${x||''}<button class="btn sm" id="out">Salir</button></div>`;
const who=()=>`${esc(ses.name)} · ${ses.adm?'Administrador':'Recepción'}`;
const ic=k=>`<svg class="ic" viewBox="0 0 52 52"><circle class="cc" cx="26" cy="26" r="24"/><path class="ck" d="${k==='ok'?'M14 27l8 8 16-17':k==='er'?'M18 18l16 16M34 18L18 34':'M26 14v17M26 38v1'}"/></svg>`;
const beep=(f,d,t)=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}};
function flash(k,t,s){if(k==='ok'){beep(880,.09);setTimeout(()=>beep(1320,.14),90)}else beep(k==='dup'?520:220,k==='dup'?.2:.35,'square');
  try{navigator.vibrate&&navigator.vibrate(k==='ok'?40:[80,60,80])}catch(e){}
  let cf='';if(k==='ok')for(let i=0;i<16;i++)cf+=`<s style="--x:${Math.round(Math.random()*240-120)}px;--y:${Math.round(-60-Math.random()*150)}px;--c:${['#2de2c9','#34e08a','#ffc857','#fff'][i%4]};--d:${(Math.random()*.2).toFixed(2)}s"></s>`;
  $('ov').innerHTML=`<div class="fl ${k}">${cf}${ic(k)}<b>${esc(t)}</b><span>${esc(s)}</span></div>`;clearTimeout(ft);ft=setTimeout(()=>$('ov').innerHTML='',k==='ok'?1500:2300)}
function ask(html,yes,lbl){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div>${html}<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="flex:1" data-n>${yes?'Cancelar':'Cerrar'}</button>${yes?`<button class="btn pri" style="flex:1" data-y>${lbl||'Confirmar'}</button>`:''}</div></div>`;document.body.appendChild(m);
  m.onclick=e=>{if(e.target===m||e.target.hasAttribute('data-n'))m.remove();else if(e.target.hasAttribute('data-y')){m.remove();yes()}}}
const save=()=>{try{localStorage.setItem(PK+cur,JSON.stringify({chk,extra,t0:t0||(t0=Date.now()),nt:window._nt||''}))}catch(e){}};
const prog=id=>{try{return JSON.parse(localStorage.getItem(PK+id)||'null')}catch(e){return null}};

function login(msg){signOut(auth).catch(()=>{});$('a').innerHTML=top('📥 Recepción de despachos','Centro de distribución Frangipani')+`<div class="wrap"><div class="card"><div class="msg" style="margin:0 0 12px">${msg||'Entra con tu usuario y contraseña. Los usuarios de recepción duran 1 hora o hasta terminar de recibir; los administradores entran con su usuario y contraseña de siempre.'}</div><input class="fld" id="lu" placeholder="Usuario" autocomplete="off" autocapitalize="none"><input class="fld" id="lp" type="password" placeholder="Contraseña"><button class="btn pri" id="go" style="width:100%;padding:14px">Entrar</button></div></div>`;$('out').style.display='none';
  const go=async()=>{const u=$('lu').value.trim().toLowerCase(),p=$('lp').value;if(!u||!p)return;$('go').disabled=true;$('go').textContent='Verificando…';
    try{await signInWithEmailAndPassword(auth,u2e(u),p);
      if(ADMINS.includes(u)){let name=u;try{const s=(await get(R(db,'users_v1'))).val(),m=s&&Object.values(s).find(z=>z&&z.user===u);if(m&&m.nombre)name=m.nombre}catch(e){}ses={user:u,name,adm:1,exp:Date.now()+12*HORA}}
      else{const x=(await get(R(db,'meta_v1/recepcion_users/'+u))).val();
        if(!x||x.baja)throw{m:'Este usuario no es de recepción o fue anulado.'};
        if(x.usado)throw{m:'Este usuario ya fue usado para una recepción.'};
        if(x.vence<Date.now())throw{m:'Este usuario venció. Pide uno nuevo.'};
        ses={user:u,name:x.nombre,exp:Math.min(Date.now()+HORA,x.vence)}}
      localStorage.setItem(KEY,JSON.stringify(ses));tab='p';list()}
    catch(e){await signOut(auth).catch(()=>{});const bad=['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(e.code);login(e.m||(bad?'Usuario o contraseña incorrectos.':'No se pudo entrar: '+(e.code||e.message)))}};
  $('go').onclick=go;$('lp').onkeydown=e=>{if(e.key==='Enter')go()}}

async function list(){ses=sess();if(!ses)return login('La sesión venció. Entra otra vez.');
  $('a').onclick=null;$('a').innerHTML=top('📥 Recepción de despachos',who(),0,'<button class="btn sm" id="rf">↻</button>')+'<div class="wrap"><div class="card msg" style="margin:0">Cargando despachos…</div></div>';$('out').onclick=salir;$('rf').onclick=list;
  try{EM=(await get(query(R(db,PB+'/emb'),orderByKey(),startAt('e'+(Date.now()-21*864e5))))).val()||{}}catch(e){$('a').innerHTML+=`<div class="wrap"><div class="card msg err">No se pudo cargar: ${esc(e.code||e.message)}</div></div>`;return}
  const A=Object.entries(EM),P=A.filter(([,e])=>e.desp&&!e.rec).sort((a,b)=>(b[1].seq||0)-(a[1].seq||0)),Rc=A.filter(([,e])=>e.rec).sort((a,b)=>(b[1].rec.ts||0)-(a[1].rec.ts||0));
  if(tab==='r'&&!ses.adm)tab='p';const tt=P.reduce((t,[,e])=>{const c=calc(e);t.p+=c.np;t.b+=c.nb;return t},{p:0,b:0});
  const stat=(n,l)=>`<div><div class="big">${n}</div><div class="lbl">${l}</div></div>`;
  const rowP=([id,e])=>{const c=calc(e),pr=prog(id),m=pr?Object.values(pr.chk||{}).filter(Boolean).length:0;return`<div class="row" data-o="${id}"><div><div class="st">Despacho ${esc(e.num)}</div><div class="ds">${fdt((e.desp&&e.desp.ts)||e.ts)} · ${c.cams.length} camión(es) · ${esc(c.cams.map(k=>k.chofer).filter(Boolean).join(', '))}</div></div><div style="text-align:right"><span class="pill ${m?'p-wn':'p-no'}">${m?`En curso ${m}/${c.np}`:`${c.np} palets`}</span><div class="ds" style="margin-top:4px">${c.nb} bultos</div></div></div>`};
  const rowR=([id,e])=>{const r=e.rec,nf=(r.falt||[]).length;return`<div class="row" data-r="${id}"><div><div class="st">Despacho ${esc(e.num)}</div><div class="ds">${esc(r.by)} · ${fdt(r.ts)}</div></div><div style="text-align:right"><span class="pill ${nf?'p-er':'p-ok'}">${nf?nf+' faltante(s)':'Completa'}</span><div class="ds" style="margin-top:4px">${r.mail==='ok'?'✉️ correo enviado':'✉️ sin enviar'}</div></div></div>`};
  $('a').innerHTML=top('📥 Recepción de despachos',who(),0,'<button class="btn sm" id="rf">↻</button>')+`<div class="wrap"><div class="card hero">${stat(P.length,'Despachos por recibir')}${stat(tt.p,'Palets')}${stat(tt.b,'Bultos')}</div>
  <div class="tabs"><button class="tab ${tab==='p'?'on':''}" data-t="p">📥 Por recibir (${P.length})</button>${ses.adm?`<button class="tab ${tab==='r'?'on':''}" data-t="r">✅ Recibidos (${Rc.length})</button>`:''}</div>
  ${tab==='p'?(P.length?P.map(rowP).join(''):'<div class="card msg">No hay despachos pendientes por recibir.</div>'):(Rc.length?Rc.map(rowR).join(''):'<div class="card msg">Aún no hay recepciones registradas.</div>')}</div>`;
  $('out').onclick=salir;$('rf').onclick=list;
  $('a').onclick=ev=>{const t=ev.target.closest('[data-t]');if(t){tab=t.dataset.t;list();return}const d=ev.target.closest('[data-o]');if(d)return open(d.dataset.o);const r=ev.target.closest('[data-r]');if(r)recDet(r.dataset.r)}}

function recDet(id){const e=EM[id],r=e.rec,c=calc(e),got=Object.keys(r.pals||{}).length,fl=c.all.filter(p=>!(r.pals&&r.pals[p.id])),d=r.t0?Math.max(1,Math.round((r.ts-r.t0)/6e4)):0;
  ask(`<h3>Despacho ${esc(e.num)}</h3><div class="msg">Recibió ${esc(r.by)} · ${fdt(r.ts)}${d?' · '+d+' min':''}</div><div class="card" style="margin-top:10px"><b>${got}</b> de ${c.np} palets recibidos · ${c.nb} bultos esperados</div>
  ${fl.length?`<div class="msg err">Faltantes: ${fl.map(p=>esc(p.n)+' ('+p.b+' b.)').join(', ')}</div>`:'<div class="msg" style="color:var(--ok)">Sin diferencias</div>'}${(r.extra||[]).length?`<div class="msg err">Escaneados que no pertenecen: ${r.extra.map(esc).join(', ')}</div>`:''}${r.nota?`<div class="msg">Observaciones: ${esc(r.nota)}</div>`:''}<div class="msg">Correo: ${r.mail==='ok'?'enviado':'no se pudo enviar'}</div>`,
  async()=>{try{await correo(e,c,r);await update(R(db,PB),{[`emb/${id}/rec/mail`]:'ok'});r.mail='ok';flash('ok','Correo reenviado',' ')}catch(x){flash('er','No se pudo enviar','Revisa la configuración de correo')}},'✉️ Reenviar correo')}

function open(id){cur=id;chk={};extra=[];t0=0;window._nt='';const p=prog(id);if(p){chk=p.chk||{};extra=p.extra||[];t0=p.t0||0;window._nt=p.nt||''}draw()}
function draw(){ses=sess();if(!ses)return login('La sesión venció. Entra otra vez.');const e=EM[cur],c=calc(e);
  $('a').onclick=null;$('a').innerHTML=top('Despacho '+esc(e.num),who(),1)+`<div class="wrap"><div class="card hero"><div><div class="lbl">Palets recibidos</div><div class="big" id="cnt"></div></div><div style="flex:1;min-width:150px"><div class="bar"><i id="pb"></i></div><div class="msg" id="pt"></div></div><div class="msg" style="width:100%;margin:0">${fdt((e.desp&&e.desp.ts)||e.ts)} · ${c.cams.length} camión(es) · ${c.nb} bultos</div></div>
  <div class="card"><div class="slbl">Escanea el palet con la pistola</div><div class="search"><div class="sbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8fc3c6" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="sc" inputmode="numeric" placeholder="Nº de palet" autocomplete="off"></div><button class="btn pri" id="sb" style="height:48px">OK</button></div></div>`+
  c.cams.map(k=>`<div class="card"><div class="cam"><span>🚛 ${esc(k.chofer)} ${k.placa?'· '+esc(k.placa):''}</span><span class="pill p-no" data-cc="${k.cid}"></span></div><div class="g">${k.pals.map(p=>`<div class="tile" data-p="${p.id}"><div class="hd">${esc(p.n)}</div><div class="bd">${p.b} bultos</div></div>`).join('')}</div></div>`).join('')+
  `<div class="card"><textarea class="fld" id="nt" rows="2" placeholder="Observaciones (faltantes, daños…)"></textarea><div style="display:flex;gap:8px"><button class="btn" id="all" style="flex:1">Marcar todos</button><button class="btn pri" id="ok" style="flex:2">Confirmar recepción</button></div></div></div>`;
  $('out').onclick=salir;$('bk').onclick=list;$('nt').value=window._nt||'';$('nt').oninput=()=>{window._nt=$('nt').value;save()};
  $('all').onclick=()=>ask('<h3>Marcar todos</h3><div class="msg">Se marcarán todos los palets como recibidos sin escanearlos. ¿Continuar?</div>',()=>{c.all.forEach(p=>chk[p.id]=1);save();paint()});
  $('a').querySelectorAll('[data-p]').forEach(t=>t.onclick=()=>{const id=t.dataset.p;chk[id]=!chk[id];save();paint()});
  const go=()=>{scan($('sc').value);$('sc').value='';$('sc').focus()};$('sc').onkeydown=ev=>{if(ev.key==='Enter')go()};$('sb').onclick=go;$('ok').onclick=fin;paint();$('sc').focus()}
function paint(){const c=calc(EM[cur]),n=c.all.filter(p=>chk[p.id]).length;$('cnt').textContent=n+' / '+c.np;$('pb').style.width=(c.np?n/c.np*100:0)+'%';
  $('pt').textContent=n===c.np?'✅ Todos los palets recibidos':`Faltan ${c.np-n} palet(s)`;
  document.querySelectorAll('[data-p]').forEach(t=>t.classList.toggle('ok',!!chk[t.dataset.p]));
  c.cams.forEach(k=>{const el=document.querySelector(`[data-cc="${k.cid}"]`);if(el){const m=k.pals.filter(p=>chk[p.id]).length;el.textContent=m+' / '+k.pals.length;el.className='pill '+(m===k.pals.length?'p-ok':m?'p-wn':'p-no')}});
  $('ok').classList.toggle('glow',n===c.np&&c.np>0)}
function scan(raw){const q=dg(raw);if(!q)return;const c=calc(EM[cur]),p=c.all.find(x=>dg(x.n)===q);
  if(!p){if(!extra.includes(q)){extra.push(q);save()}flash('er','Palet '+q+' no pertenece','No está en el despacho '+EM[cur].num);return}
  if(chk[p.id]){flash('dup','Palet '+p.n+' ya escaneado','Ya estaba marcado como recibido');return}
  chk[p.id]=1;save();paint();const t=document.querySelector(`[data-p="${p.id}"]`);if(t){t.classList.add('pop');t.scrollIntoView({block:'nearest',behavior:'smooth'});setTimeout(()=>t.classList.remove('pop'),600)}
  const k=c.cams.find(z=>z.pals.some(y=>y.id===p.id)),n=c.all.filter(z=>chk[z.id]).length;
  flash('ok','Palet '+p.n+' recibido',n===c.np?'¡Despacho completo! Confirma la recepción':`${p.b} bultos · 🚛 ${k.chofer||k.placa||'camión'} · ${n} de ${c.np}`)}

function fin(){if(busy)return;const e=EM[cur],c=calc(e),got=c.all.filter(p=>chk[p.id]),falt=c.all.filter(p=>!chk[p.id]),nota=($('nt').value||'').trim();
  if(!got.length){flash('er','Sin palets','Escanea o marca al menos un palet');return}
  const fb=falt.reduce((t,p)=>t+p.b,0);
  ask(`<h3>${falt.length?'⚠️ Recepción con faltantes':'✅ Confirmar recepción completa'}</h3><div class="msg">${got.length} de ${c.np} palets recibidos</div>${falt.length?`<div class="msg err">Faltan ${falt.length} palet(s) · ${fb} bultos: ${falt.map(p=>esc(p.n)).join(', ')}</div>`:''}${extra.length?`<div class="msg err">Escaneados que no pertenecen: ${extra.map(esc).join(', ')}</div>`:''}<div class="msg">Al confirmar se envía automáticamente el correo de recepción a los involucrados del despacho.</div>`,()=>done(e,c,got,falt,nota),'Confirmar y enviar')}
async function done(e,c,got,falt,nota){busy=true;const ts=Date.now(),rec={by:ses.name,u:ses.user,ts,t0:t0||ts,pals:Object.fromEntries(got.map(p=>[p.id,1])),falt:falt.map(p=>p.n),nota};if(extra.length)rec.extra=extra;
  const up={[`emb/${cur}/rec`]:rec};got.forEach(p=>up[`pm/${p.id}/rcv`]={by:ses.name,u:ses.user,ts,e:cur});
  $('a').innerHTML=top('Despacho '+esc(e.num),who())+'<div class="wrap"><div class="card msg" style="text-align:center">⏳ Guardando recepción y enviando correo…</div></div>';$('out').style.display='none';
  try{await update(R(db,PB),up)}catch(err){busy=false;flash('er','No se pudo guardar',err.code||err.message);draw();return}
  let mail='ok';try{await correo(e,c,rec)}catch(err){mail='fail'}
  try{await update(R(db,PB),{[`emb/${cur}/rec/mail`]:mail})}catch(x){}
  const adm=ses.adm,nm=ses.name;if(!adm){try{await update(R(db,'meta_v1/recepcion_users/'+ses.user),{usado:ts,despacho:e.num})}catch(x){}localStorage.removeItem(KEY);signOut(auth).catch(()=>{})}
  try{localStorage.removeItem(PK+cur)}catch(x){}window._nt='';busy=false;
  $('a').innerHTML=`<div class="wrap" style="padding-top:40px"><div class="card ${falt.length?'dup':'ok'}" style="text-align:center">${ic(falt.length?'dup':'ok')}<h2>Recepción registrada</h2><div class="msg">Despacho <b>${esc(e.num)}</b> · ${got.length} de ${c.np} palets recibidos</div>${falt.length?`<div class="msg err">${falt.length} faltante(s): ${falt.map(p=>esc(p.n)).join(', ')}</div>`:'<div class="msg" style="color:var(--ok)">Sin diferencias</div>'}<div class="msg">Recibió: ${esc(nm)} · ${fdt(ts)}</div><div class="msg">${mail==='ok'?'✉️ Correo de recepción enviado automáticamente.':'⚠️ El correo no se pudo enviar; la recepción sí quedó guardada.'}</div><button class="btn pri" id="nx" style="width:100%;margin-top:14px;padding:14px">${adm?'Volver a la lista':'Terminar'}</button></div></div>`;
  $('nx').onclick=()=>adm?list():login()}

async function correo(e,c,r){const cfg=(await get(R(db,'meta_v1/email_cfg'))).val(),mm=e.mail||(await get(R(db,PB+'/cfg'))).val()||{};
  if(!cfg||!cfg.serviceId||!cfg.templateId||!cfg.publicKey||!mm.to)throw 0;emailjs.init(cfg.publicKey);
  const P=r.pals||{},got=c.all.filter(p=>P[p.id]),falt=c.all.filter(p=>!P[p.id]),bg=got.reduce((t,p)=>t+p.b,0),bf=falt.reduce((t,p)=>t+p.b,0),d=r.t0?Math.max(1,Math.round((r.ts-r.t0)/6e4)):0;
  const row=(a,b)=>`<tr><td style="padding:6px 10px;border-bottom:1px solid #d9e1e8;color:#5a6b7a">${a}</td><td style="padding:6px 10px;border-bottom:1px solid #d9e1e8"><b>${b}</b></td></tr>`;
  const chip=(p,ok)=>`<span style="display:inline-block;margin:2px;padding:3px 8px;border-radius:8px;font-size:12px;background:${ok?'#d6f5e3;color:#0b5a32':'#fde0dd;color:#a3271b'}">${esc(p.n)} · ${p.b}</span>`;
  const cams=c.cams.map(k=>`<tr><td colspan="2" style="padding:8px 10px;background:#eef3f6"><b>🚛 ${esc(k.chofer)} ${esc(k.placa)}</b></td></tr><tr><td colspan="2" style="padding:6px 10px">${k.pals.map(p=>chip(p,!!P[p.id])).join('')}</td></tr>`).join('');
  const html=`<div style="font-family:Arial,sans-serif;max-width:600px"><h2 style="color:#0b3b5c">Recepción del despacho ${esc(e.num)} · ${falt.length?'con faltantes':'completa'}</h2><table style="border-collapse:collapse;width:100%">${row('Recibió',esc(r.by))}${row('Fecha y hora',new Date(r.ts).toLocaleString('es'))}${d?row('Duración de la recepción',d+' min'):''}${row('Palets esperados',c.np+' ('+c.nb+' bultos)')}${row('Palets recibidos',got.length+' ('+bg+' bultos)')}${row('Faltantes',falt.length?`<span style="color:#c0392b">${falt.map(p=>esc(p.n)).join(', ')} (${bf} bultos)</span>`:'Ninguno')}${(r.extra||[]).length?row('Escaneados que no pertenecen',`<span style="color:#c0392b">${r.extra.map(esc).join(', ')}</span>`):''}${row('Observaciones',esc(r.nota)||'—')}${cams}</table><p style="color:#8a98a6;font-size:11px">Verde: recibido · Rojo: faltante. Cada etiqueta muestra palet · bultos.</p></div>`;
  await emailjs.send('service_gqk1da3',cfg.templateId,{to_email:mm.to,cc_email:mm.cc||'',subject:`RE: Despacho ${e.num} · Recepción ${falt.length?'con faltantes':'completa'}`,html_content:html,message:`Recepción del despacho ${e.num} por ${r.by}: ${got.length}/${c.np} palets.`,saludo:'',periodo:e.num,timestamp:new Date().toLocaleString('es')})}

(async()=>{try{await auth.authStateReady()}catch(e){}
  const s=sess();setInterval(()=>{if(!sess()&&$('go')===null&&!busy&&localStorage.getItem(KEY))list()},60000);
  if(s&&auth.currentUser&&auth.currentUser.email===u2e(s.user))list();else login()})();
</script></body></html>
