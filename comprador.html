<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Despacho a tiendas · Comprador</title>
<style>
:root{--teal:#0f9d9a;--teal2:#0b7f7c;--bg:#f3f8f8;--card:#fff;--tx:#12302f;--mt:#5f7b7a;--bd:#d6e6e5;--zb:#f7fbfb}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;padding:18px 16px 16px}
header h1{margin:0;font-size:20px;letter-spacing:.2px}
header .sub{opacity:.9;font-size:12.5px;margin-top:3px}
.wrap{max-width:1280px;margin:0 auto;padding:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:-26px 0 12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;box-shadow:0 2px 8px #0f9d9a14}
.kpi b{display:block;font-size:20px;color:var(--teal2)}.kpi span{font-size:11.5px;color:var(--mt);text-transform:uppercase;letter-spacing:.5px}
.bar{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:5}
.bar input,.bar select{font:inherit;border:1px solid var(--bd);border-radius:9px;padding:8px 10px;background:#fff;color:var(--tx);min-width:0}
.bar input[type=search]{flex:1 1 220px}.bar select{flex:1 1 140px}.bar input[type=number]{width:110px}
.btn{font:inherit;font-weight:700;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;background:var(--teal);color:#fff}
.btn.sec{background:#e3f1f0;color:var(--teal2)}
.cnt{font-size:12.5px;color:var(--mt);margin:10px 4px 6px}
.tw{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:auto;max-height:68vh}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1020px}
th{position:sticky;top:0;background:var(--teal);color:#fff;text-align:left;padding:10px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;white-space:nowrap;user-select:none}
th.n,td.n{text-align:right}
th .ar{opacity:.85;margin-left:4px}
td{padding:8px 10px;border-top:1px solid var(--bd);vertical-align:top}
tr:nth-child(even) td{background:var(--zb)}
tr:hover td{background:#e8f6f5}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.tag{display:inline-block;background:#e3f1f0;color:var(--teal2);border-radius:99px;padding:1px 9px;font-weight:700;font-size:12px;white-space:nowrap}
.msg{padding:40px 16px;text-align:center;color:var(--mt)}
.err{color:#b3261e}
footer{color:var(--mt);font-size:11.5px;text-align:center;padding:14px}
@media(max-width:600px){header h1{font-size:17px}.kpis{margin-top:-20px}}
</style>
</head>
<body>
<header>
  <h1 id="ttl">Despacho a tiendas</h1>
  <div class="sub" id="sub">Cargando…</div>
</header>
<div class="wrap">
  <div id="app"><div class="msg">Cargando despacho…</div></div>
</div>
<footer>Vista de solo lectura · Westland</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import{getDatabase,ref,get}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

const FB={apiKey:"AIzaSyCn7bUx8PdK-1TCmOnffWJYLouC5vdGMIE",authDomain:"westland-marcaciones.firebaseapp.com",projectId:"westland-marcaciones",databaseURL:"https://westland-marcaciones-default-rtdb.firebaseio.com"};
const CMPB='meta_v1/comprador';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US');
const fmtB=n=>Number((+n||0).toFixed(2)).toLocaleString('en-US');
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const fdt=ts=>new Date(ts).toLocaleString('es',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

const COLS=[
 {k:'t',h:'Tienda',f:r=>r.t+(r.tn?' · '+r.tn:'')},
 {k:'tr',h:'Transferencia'},
 {k:'e',h:'Estilo'},
 {k:'p',h:'Producto',mono:1},
 {k:'d',h:'Descripción'},
 {k:'u',h:'Código barras',mono:1},
 {k:'q',h:'Piezas',n:1},
 {k:'pb',h:'Pza x bulto',n:1},
 {k:'bt',h:'Bultos transf.',n:1,fm:fmtB},
 {k:'bg',h:'Bultos (etiquetas)',mono:1},
 {k:'s',h:'Surtidor'}
];
let ROWS=[],VIEW=[],SORT={k:'t',d:1},META={};

const tok=(location.hash.slice(1)||new URLSearchParams(location.search).get('t')||'').trim();

function fail(m){$('sub').textContent='';$('app').innerHTML=`<div class="msg err"><b>${esc(m)}</b><br><span style="color:var(--mt)">Pide a tu contacto que te reenvíe el enlace.</span></div>`}

async function load(){
  if(!/^[A-Za-z0-9_-]{16,64}$/.test(tok)){fail('Enlace no válido');return}
  try{
    const app=initializeApp(FB),auth=getAuth(app);
    if(!auth.currentUser)await signInAnonymously(auth);
    const snap=await get(ref(getDatabase(app),`${CMPB}/${tok}`));
    const v=snap.val();
    if(!v||!v.rows){fail('Este enlace no está activo o fue desactivado');return}
    META=v;ROWS=Object.values(v.rows);
    paint();
  }catch(e){fail('No se pudo abrir el despacho ('+(e.code||e.message)+')')}
}

function paint(){
  $('ttl').textContent=`Despacho ${META.num||''} · Recibo ${META.rec||''}`;
  $('sub').textContent=`Despachado ${fdt(META.ts)} · Datos actualizados ${fdt(META.pub)}`;
  const opt=(k,all)=>[...new Set(ROWS.map(r=>r[k]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'es',{numeric:true}));
  const sel=(id,lbl,arr)=>`<select id="${id}"><option value="">${lbl}</option>${arr.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`;
  const surt=[...new Set(ROWS.flatMap(r=>String(r.s||'').split(', ').filter(Boolean)))].sort();
  $('app').innerHTML=`<div class="kpis" id="kp"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="Buscar código, estilo, descripción, bulto…">
    ${sel('ft','Todas las tiendas',opt('t'))}
    ${sel('fr','Todas las transferencias',opt('tr'))}
    ${sel('fs','Todos los surtidores',surt)}
    <input type="number" id="fm" min="0" placeholder="Pzas ≥">
    <button class="btn sec" id="clr">Limpiar</button>
    <button class="btn" id="xl">📥 Excel</button>
  </div>
  <div class="cnt" id="cnt"></div>
  <div class="tw"><table><thead><tr id="hd"></tr></thead><tbody id="tb"></tbody></table></div>`;
  $('hd').innerHTML=COLS.map(c=>`<th data-k="${c.k}" class="${c.n?'n':''}">${c.h}<span class="ar" id="ar_${c.k}"></span></th>`).join('');
  $('hd').onclick=e=>{const th=e.target.closest('th');if(!th)return;const k=th.dataset.k;SORT=SORT.k===k?{k,d:-SORT.d}:{k,d:1};render()};
  ['q','ft','fr','fs','fm'].forEach(id=>$(id).addEventListener(id==='q'||id==='fm'?'input':'change',render));
  $('clr').onclick=()=>{['q','ft','fr','fs','fm'].forEach(id=>$(id).value='');render()};
  $('xl').onclick=excel;
  render();
}

function render(){
  const q=norm($('q').value).split(/\s+/).filter(Boolean),ft=$('ft').value,fr=$('fr').value,fs=$('fs').value,fm=+$('fm').value||0;
  VIEW=ROWS.filter(r=>{
    if(ft&&r.t!==ft)return false;if(fr&&r.tr!==fr)return false;if(fs&&!String(r.s||'').split(', ').includes(fs))return false;if(fm&&(r.q||0)<fm)return false;
    if(q.length){const h=norm([r.t,r.tn,r.tr,r.e,r.p,r.d,r.u,r.bg,r.s].join(' '));if(!q.every(w=>h.includes(w)))return false}
    return true});
  const k=SORT.k,d=SORT.d,num=COLS.find(c=>c.k===k).n;
  VIEW.sort((a,b)=>d*(num?(a[k]||0)-(b[k]||0):String(a[k]||'').localeCompare(String(b[k]||''),'es',{numeric:true})));
  COLS.forEach(c=>{const a=$('ar_'+c.k);if(a)a.textContent=c.k===k?(d>0?'▲':'▼'):''});
  const pz=VIEW.reduce((a,r)=>a+(r.q||0),0),rf=new Set(VIEW.map(r=>r.p)).size,
        trs=new Set(VIEW.map(r=>r.t+'|'+r.tr)),bu=[...trs].reduce((a,t)=>{const r=VIEW.find(x=>x.t+'|'+x.tr===t);return a+(r?r.bt||0:0)},0);
  $('kp').innerHTML=[['Piezas',fmt(pz)],['Referencias',fmt(rf)],['Tiendas',fmt(new Set(VIEW.map(r=>r.t)).size)],['Transferencias',fmt(trs.size)],['Bultos',fmtB(bu)]].map(([l,v])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('');
  $('cnt').textContent=`${fmt(VIEW.length)} de ${fmt(ROWS.length)} líneas`;
  $('tb').innerHTML=VIEW.length?VIEW.map(r=>`<tr>${COLS.map(c=>{const v=c.f?c.f(r):(c.fm?c.fm(r[c.k]):r[c.k]);
    const s=c.k==='t'?`<span class="tag">${esc(v)}</span>`:esc(c.n&&!c.fm?fmt(v):v);return `<td class="${c.n?'n':''} ${c.mono?'mono':''}">${s}</td>`}).join('')}</tr>`).join(''):`<tr><td colspan="${COLS.length}" class="msg">Sin resultados</td></tr>`;
}

function excel(){
  if(!window.XLSX){alert('No cargó la librería de Excel. Revisa tu conexión.');return}
  const hdr=['Despacho','Tienda','Nombre tienda','Transferencia','Estilo','Producto','Descripción','Código barras','Piezas','Pza x bulto','Bultos transf.','Bultos (etiquetas)','Surtidor'];
  const body=VIEW.map(r=>[META.num||'',r.t,r.tn||'',r.tr||'',r.e||'',r.p||'',r.d||'',r.u||'',r.q||0,r.pb||0,r.bt||0,r.bg||'',r.s||'']);
  const tot=['TOTAL','','','','','','','',VIEW.reduce((a,r)=>a+(r.q||0),0),'','','',''];
  const ws=XLSX.utils.aoa_to_sheet([[`Despacho ${META.num||''} · Recibo ${META.rec||''}`],[`Despachado: ${fdt(META.ts)}`],[],hdr,...body,tot]);
  ws['!cols']=[10,10,18,16,14,12,46,16,9,10,12,24,22].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Despacho');
  XLSX.writeFile(wb,`despacho_${META.num||'tiendas'}_${META.rec||''}.xlsx`);
}
load();
</script>
</body>
</html>
