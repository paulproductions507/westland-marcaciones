<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Packing list · Comprador</title>
<style>
:root{--teal:#0f9d9a;--teal2:#0b7f7c;--ink:#12302f;--mt:#5f7b7a;--bg:#f1f7f7;--card:#fff;--bd:#d6e6e5;--zb:#f7fbfb;--amb:#e8a317;--ok:#1b9b5a}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;padding:20px 16px 44px}
.hin{max-width:1280px;margin:0 auto}
header h1{margin:0;font-size:21px;letter-spacing:.2px}
header .sub{opacity:.92;font-size:12.5px;margin-top:4px}
.wrap{max-width:1280px;margin:-30px auto 0;padding:0 12px 24px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0f9d9a12}
.card h2{margin:0 0 10px;font-size:15px;color:var(--teal2);text-transform:uppercase;letter-spacing:.6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:var(--zb);border:1px solid var(--bd);border-top:4px solid var(--teal);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:22px;color:var(--teal2)}.kpi span{font-size:11px;color:var(--mt);text-transform:uppercase;letter-spacing:.5px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input,.tools select{font:inherit;border:1px solid var(--bd);border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink);min-width:0}
.tools input[type=search]{flex:1 1 220px}.tools select{flex:1 1 140px}.tools input[type=number]{width:105px}
.btn{font:inherit;font-weight:700;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;background:var(--teal);color:#fff}
.btn.sec{background:#e3f1f0;color:var(--teal2)}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-weight:700;font-size:12px;white-space:nowrap}
.chip.D{background:#fff3d6;color:#8a5a00}.chip.R{background:#dcf5e8;color:#0e6b3c}.chip.T{background:#e3f1f0;color:var(--teal2)}.chip.P{background:#ffe5e2;color:#a3261b}
.lst{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pl{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s}
.pl:hover{transform:translateY(-2px);box-shadow:0 6px 18px #0f9d9a28}
.pl .hd{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.pl .hd b{font-size:17px}
.pl .bd{padding:10px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.pl .bd b{display:block;font-size:17px;color:var(--teal2)}.pl .bd span{font-size:10.5px;color:var(--mt);text-transform:uppercase}
.pl .ft{padding:0 12px 10px;font-size:12px;color:var(--mt)}
.back{background:none;border:0;color:#fff;font:inherit;font-weight:700;cursor:pointer;padding:0 0 8px;opacity:.95}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:12px;max-height:62vh}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;background:var(--teal);color:#fff;text-align:left;padding:10px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;cursor:pointer;user-select:none}
th.n,td.n{text-align:right}
td{padding:8px 10px;border-top:1px solid var(--bd);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--zb)}tbody tr:hover td{background:#e8f6f5}
tfoot td{background:#e3f1f0!important;font-weight:800;position:sticky;bottom:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.sb{display:grid;grid-template-columns:130px 1fr 190px;gap:10px;align-items:center;padding:5px 0}
.sb .tr{background:#e3efee;border-radius:99px;height:16px;overflow:hidden}.sb .tr i{display:block;height:100%;background:linear-gradient(90deg,#14b8b3,var(--teal2));border-radius:99px}
.sb .lb{font-weight:700}.sb .vl{font-size:12.5px;text-align:right;color:var(--mt)}.sb .vl b{color:var(--ink)}
.msg{padding:36px 14px;text-align:center;color:var(--mt)}.err{color:#b3261e}
.cnt{font-size:12.5px;color:var(--mt);margin:8px 2px}
footer{color:var(--mt);font-size:11.5px;text-align:center;padding:10px}
.hide{display:none!important}
@media(max-width:640px){.sb{grid-template-columns:90px 1fr;}.sb .vl{grid-column:1/-1;text-align:left}}
@media print{
  @page{size:landscape;margin:10mm}
  body{background:#fff}header{padding:10px 12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.wrap{margin:0;padding:0}
  .noprint,.back,.tools{display:none!important}
  .card{box-shadow:none;break-inside:avoid-page}.tw{max-height:none!important;overflow:visible!important;border:0}
  th{position:static;-webkit-print-color-adjust:exact;print-color-adjust:exact}tfoot td{position:static}
  .kpi,.sb .tr i,.chip{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table{font-size:11px}td,th{padding:5px 6px}
}
</style>
</head>
<body>
<header><div class="hin">
  <button class="back hide noprint" id="bk">← Todos los packing list</button>
  <h1 id="ttl">Packing list a tiendas</h1>
  <div class="sub" id="sub">Cargando…</div>
</div></header>
<div class="wrap"><div id="app"><div class="card msg">Cargando…</div></div></div>
<footer class="noprint">Vista de solo lectura · Westland</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import{getDatabase,ref,get}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

const FB={apiKey:"AIzaSyCn7bUx8PdK-1TCmOnffWJYLouC5vdGMIE",authDomain:"westland-marcaciones.firebaseapp.com",projectId:"westland-marcaciones",databaseURL:"https://westland-marcaciones-default-rtdb.firebaseio.com"};
const CMPB='meta_v1/comprador';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US');
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const fdt=ts=>ts?new Date(ts).toLocaleString('es',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const ST={D:'Despachado',R:'Recibido'};

let db,TOK='',IDX={},PL=null,CUR='',ROWS=[],VIEW=[],SORT={k:'t',d:1};

const COLS=[
 {k:'t',h:'Tienda',f:r=>r.t+(r.tn?' · '+r.tn:'')},
 {k:'tr',h:'Transferencia'},
 {k:'cm',h:'Camión'},
 {k:'pl',h:'Palet'},
 {k:'e',h:'Estilo'},
 {k:'p',h:'Producto',mono:1},
 {k:'d',h:'Descripción'},
 {k:'u',h:'Código barras',mono:1},
 {k:'q',h:'Piezas',n:1},
 {k:'bt',h:'Bultos',n:1,f:r=>r.bt+(r.pa?' de '+r.N:'')},
 {k:'rc',h:'Recibo'},
 {k:'s',h:'Surtidor'}
];

function route(){
  const [t,id]=location.hash.slice(1).split('/');
  if(t!==TOK&&TOK)return;
  id?openPL(id):showList();
}
window.addEventListener('hashchange',()=>{if(TOK)route()});

function fail(m){$('bk').classList.add('hide');$('sub').textContent='';$('app').innerHTML=`<div class="card msg err"><b>${esc(m)}</b><br><span style="color:var(--mt)">Pide que te reenvíen el enlace.</span></div>`}

async function init(){
  const t=(location.hash.slice(1).split('/')[0]||new URLSearchParams(location.search).get('t')||'').trim();
  if(!/^[A-Za-z0-9_-]{16,64}$/.test(t)){fail('Enlace no válido');return}
  TOK=t;
  try{
    const app=initializeApp(FB),auth=getAuth(app);db=getDatabase(app);
    if(!auth.currentUser)await signInAnonymously(auth);
    IDX=(await get(ref(db,`${CMPB}/${TOK}/idx`))).val()||{};
    if(!Object.keys(IDX).length){fail('Este enlace no tiene packing list publicados o fue desactivado');return}
    route();
  }catch(e){fail('No se pudo abrir ('+(e.code||e.message)+')')}
}

/* ---------- LISTA ---------- */
function showList(){
  PL=null;CUR='';
  $('bk').classList.add('hide');$('ttl').textContent='Packing list a tiendas';
  const all=Object.entries(IDX).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0));
  $('sub').textContent=`${all.length} packing list disponibles · elige uno para ver el detalle`;
  const tp=all.reduce((a,[,v])=>a+(v.tp||0),0),tb=all.reduce((a,[,v])=>a+(v.tb||0),0);
  $('app').innerHTML=`<div class="card"><div class="kpis">
      <div class="kpi"><b>${fmt(all.length)}</b><span>Packing list</span></div>
      <div class="kpi"><b>${fmt(all.filter(([,v])=>v.st==='R').length)}</b><span>Recibidos</span></div>
      <div class="kpi"><b>${fmt(all.filter(([,v])=>v.st!=='R').length)}</b><span>Despachados (en tránsito)</span></div>
      <div class="kpi"><b>${fmt(tb)}</b><span>Bultos</span></div>
      <div class="kpi"><b>${fmt(tp)}</b><span>Piezas</span></div></div></div>
    <div class="card"><div class="tools"><input type="search" id="lq" placeholder="Buscar packing list…">
      <select id="ls"><option value="">Todos los estados</option><option value="D">Despachado</option><option value="R">Recibido</option></select></div></div>
    <div class="lst" id="lst"></div>`;
  const draw=()=>{const q=norm($('lq').value),s=$('ls').value;
    const r=all.filter(([,v])=>(!s||(v.st==='R'?'R':'D')===s)&&(!q||norm(v.num).includes(q)));
    $('lst').innerHTML=r.map(([id,v])=>`<div class="pl" data-id="${esc(id)}"><div class="hd"><b>${esc(v.num)}</b><span class="chip ${v.st==='R'?'R':'D'}">${v.st==='R'?'📥 Recibido':'🚚 Despachado'}</span></div>
      <div class="bd"><div><b>${fmt(v.tb)}</b><span>Bultos</span></div><div><b>${fmt(v.tp)}</b><span>Piezas</span></div><div><b>${fmt(v.ns)}</b><span>Tiendas</span></div></div>
      <div class="ft">${fmt(v.nc)} camión(es) · ${fmt(v.np)} palets · ${fmt(v.tf)} transf.<br>Despachado ${fdt(v.ts)}${v.st==='R'?'<br>Recibido '+fdt(v.rts):''}</div></div>`).join('')||'<div class="card msg">Sin resultados</div>'};
  $('lq').oninput=draw;$('ls').onchange=draw;draw();
  $('lst').onclick=e=>{const c=e.target.closest('.pl');if(c)location.hash=TOK+'/'+c.dataset.id};
}

/* ---------- DETALLE ---------- */
async function openPL(id){
  $('app').innerHTML='<div class="card msg">Cargando packing list…</div>';
  try{const v=(await get(ref(db,`${CMPB}/${TOK}/pl/${id}`))).val();
    if(!v){fail('Ese packing list ya no está disponible');return}
    PL=v;CUR=id;ROWS=Object.values(v.rows||{});SORT={k:'t',d:1};paintPL()}
  catch(e){fail('No se pudo abrir ('+(e.code||e.message)+')')}
}

function paintPL(){
  const v=PL,rc=v.st==='R';
  $('bk').classList.remove('hide');$('bk').onclick=()=>{location.hash=TOK};
  $('ttl').textContent=`Packing list ${v.num}`;
  $('sub').textContent=`${ST[v.st]||'Despachado'} · despachado ${fdt(v.ts)}${rc?' · recibido '+fdt(v.rts):''}`;
  const tp=Math.max(1,v.tp||0),refs=new Set(ROWS.map(r=>r.p).filter(Boolean)).size,parc=ROWS.filter(r=>r.pa).length;
  const opt=k=>[...new Set(ROWS.map(r=>r[k]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'es',{numeric:true}));
  const sel=(id,l,a)=>`<select id="${id}"><option value="">${l}</option>${a.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`;
  $('app').innerHTML=`
  <div class="card"><div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div><span class="chip ${rc?'R':'D'}">${rc?'📥 Recibido':'🚚 Despachado'}</span> <span style="color:var(--mt);font-size:12.5px;margin-left:6px">Preparó ${esc(v.prep||'—')} · Despachó ${esc(v.dby||'—')}${rc&&v.rby?' · Recibió '+esc(v.rby):''}</span></div>
    <div class="noprint" style="display:flex;gap:8px"><button class="btn" id="xl">📥 Excel</button><button class="btn sec" id="pdf">🖨 PDF</button></div></div>
    <div class="kpis">${[['Camiones',v.cams.length],['Palets',v.np],['Bultos',v.tb],['Piezas',v.tp],['Referencias',refs],['Tiendas',v.stores.length],['Transferencias',v.tf]].map(([l,n])=>`<div class="kpi"><b>${fmt(n)}</b><span>${l}</span></div>`).join('')}</div>
    ${parc?`<div class="cnt" style="color:#a3261b">⚠ ${parc} línea(s) pertenecen a transferencias enviadas parcialmente en este packing list (se marcan “x de N” bultos). Las piezas mostradas son las de la transferencia completa.</div>`:''}</div>

  <div class="card"><h2>Distribución por tienda</h2>${v.stores.map(s=>{const pc=(s.pz||0)/tp*100;return `<div class="sb"><div class="lb">${esc(s.t)}${s.tn?'<br><small style="color:var(--mt);font-weight:400">'+esc(s.tn)+'</small>':''}</div><div class="tr"><i style="width:${Math.max(1,pc).toFixed(1)}%"></i></div><div class="vl"><b>${pc.toFixed(1)}%</b> · ${fmt(s.pz)} pzas · ${fmt(s.b)} bultos · ${fmt(s.tf)} transf.</div></div>`}).join('')}</div>

  <div class="card"><h2>Camiones</h2><div class="tw" style="max-height:none"><table><thead><tr><th>Camión</th><th>Chofer</th><th>Placa</th><th>Palets</th><th class="n">Bultos</th><th class="n">Piezas</th></tr></thead><tbody>${v.cams.map(c=>`<tr><td>${c.n}</td><td>${esc(c.chofer||'—')}</td><td>${esc(c.placa||'—')}</td><td>${esc(c.pals||'')}<br><small style="color:var(--mt)">${c.np} palets</small></td><td class="n">${fmt(c.b)}</td><td class="n">${fmt(c.pz)}</td></tr>`).join('')}</tbody></table></div></div>

  <div class="card"><h2>Detalle de productos</h2>
    <div class="tools noprint"><input type="search" id="q" placeholder="Buscar código, estilo, descripción, transferencia…">${sel('ft','Todas las tiendas',opt('t'))}${sel('fr','Todas las transferencias',opt('tr'))}${sel('fc','Todos los camiones',opt('cm'))}<input type="number" id="fm" min="0" placeholder="Pzas ≥"><button class="btn sec" id="clr">Limpiar</button></div>
    <div class="cnt" id="cnt"></div>
    <div class="tw"><table><thead><tr id="hd"></tr></thead><tbody id="tb"></tbody><tfoot><tr id="tf"></tr></tfoot></table></div></div>`;
  $('hd').innerHTML=COLS.map(c=>`<th data-k="${c.k}" class="${c.n?'n':''}">${c.h}<span id="ar_${c.k}" style="margin-left:4px"></span></th>`).join('');
  $('hd').onclick=e=>{const th=e.target.closest('th');if(!th)return;const k=th.dataset.k;SORT=SORT.k===k?{k,d:-SORT.d}:{k,d:1};render()};
  ['q','ft','fr','fc','fm'].forEach(id=>$(id).addEventListener(id==='q'||id==='fm'?'input':'change',render));
  $('clr').onclick=()=>{['q','ft','fr','fc','fm'].forEach(id=>$(id).value='');render()};
  $('xl').onclick=excel;$('pdf').onclick=()=>{render(true);window.print()};
  render();
}

function render(all){
  const q=norm($('q').value).split(/\s+/).filter(Boolean),ft=$('ft').value,fr=$('fr').value,fc=$('fc').value,fm=+$('fm').value||0;
  VIEW=ROWS.filter(r=>{
    if(ft&&r.t!==ft)return false;if(fr&&r.tr!==fr)return false;if(fc&&!String(r.cm||'').split(', ').includes(fc))return false;if(fm&&(r.q||0)<fm)return false;
    if(q.length){const h=norm([r.t,r.tn,r.tr,r.cm,r.pl,r.e,r.p,r.d,r.u,r.rc,r.s].join(' '));if(!q.every(w=>h.includes(w)))return false}
    return true});
  const k=SORT.k,d=SORT.d,num=COLS.find(c=>c.k===k).n;
  VIEW.sort((a,b)=>d*(num?(a[k]||0)-(b[k]||0):String(a[k]||'').localeCompare(String(b[k]||''),'es',{numeric:true})));
  COLS.forEach(c=>{const a=$('ar_'+c.k);if(a)a.textContent=c.k===k?(d>0?'▲':'▼'):''});
  $('cnt').textContent=`${fmt(VIEW.length)} de ${fmt(ROWS.length)} líneas`;
  $('tb').innerHTML=VIEW.length?VIEW.map(r=>`<tr>${COLS.map(c=>{const v=c.f?c.f(r):r[c.k];
    const s=c.k==='t'?`<span class="chip T">${esc(v)}</span>`:c.k==='bt'&&r.pa?`<span class="chip P">${esc(v)}</span>`:esc(c.n&&c.k==='q'?fmt(v):v);
    return `<td class="${c.n?'n':''} ${c.mono?'mono':''}">${s}</td>`}).join('')}</tr>`).join(''):`<tr><td colspan="${COLS.length}" class="msg">Sin resultados</td></tr>`;
  $('tf').innerHTML=`<td colspan="8"><b>TOTAL (${fmt(VIEW.length)} líneas)</b></td><td class="n">${fmt(VIEW.reduce((a,r)=>a+(r.q||0),0))}</td><td colspan="3"></td>`;
}

function excel(){
  if(!window.XLSX){alert('No cargó la librería de Excel. Revisa tu conexión.');return}
  const v=PL,tp=Math.max(1,v.tp||0),wb=XLSX.utils.book_new();
  const add=(name,aoa,w)=>{const ws=XLSX.utils.aoa_to_sheet(aoa);if(w)ws['!cols']=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,name)};
  add('Resumen',[[`Packing list ${v.num}`],['Estado',ST[v.st]||'Despachado'],['Despachado',fdt(v.ts)],['Recibido',v.st==='R'?fdt(v.rts):''],['Preparó',v.prep||''],['Despachó',v.dby||''],[],
    ['Camiones',v.cams.length],['Palets',v.np],['Bultos',v.tb],['Piezas',v.tp],['Tiendas',v.stores.length],['Transferencias',v.tf]],[18,34]);
  add('Por tienda',[['Tienda','Nombre','% de piezas','Piezas','Bultos','Transferencias'],...v.stores.map(s=>[s.t,s.tn||'',+((s.pz||0)/tp*100).toFixed(1),s.pz||0,s.b||0,s.tf||0]),['TOTAL','','100',v.tp,v.tb,v.tf]],[14,18,12,10,10,14]);
  add('Camiones',[['Camión','Chofer','Placa','Palets','Cant. palets','Bultos','Piezas'],...v.cams.map(c=>[c.n,c.chofer||'',c.placa||'',c.pals||'',c.np||0,c.b||0,c.pz||0])],[9,22,12,40,12,10,10]);
  add('Productos',[['Tienda','Nombre tienda','Transferencia','Camión','Palet','Estilo','Producto','Descripción','Código barras','Piezas','Bultos en este PL','Bultos transf.','Recibo','Surtidor'],
    ...VIEW.map(r=>[r.t,r.tn||'',r.tr||'',r.cm||'',r.pl||'',r.e||'',r.p||'',r.d||'',r.u||'',r.q||0,r.bt||0,r.N||0,r.rc||'',r.s||'']),
    ['TOTAL','','','','','','','','',VIEW.reduce((a,r)=>a+(r.q||0),0),'','','','']],[10,18,16,9,16,14,12,46,16,9,12,12,10,22]);
  XLSX.writeFile(wb,`packing_list_${v.num}.xlsx`);
}
init();
</script>
</body>
</html>
